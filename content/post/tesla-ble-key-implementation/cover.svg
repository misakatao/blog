<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1222"/>
      <stop offset="0.5" stop-color="#162032"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1A2744" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F1B2E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="codePanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D1520"/>
      <stop offset="1" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="200" cy="150" r="120" fill="url(#glow1)"/>
  <circle cx="1400" cy="750" r="140" fill="url(#glow2)"/>
  <circle cx="1300" cy="120" r="80" fill="#22D3EE" fill-opacity="0.08"/>
  <circle cx="300" cy="780" r="90" fill="#A78BFA" fill-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="1400" height="700" rx="32" fill="url(#panel)" stroke="#2A3F5F" stroke-width="1"/>
  </g>

  <!-- Code panel left -->
  <rect x="140" y="320" width="520" height="420" rx="16" fill="url(#codePanel)" stroke="#1E3A5F" stroke-width="1"/>
  <circle cx="164" cy="344" r="6" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="184" cy="344" r="6" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="204" cy="344" r="6" fill="#22C55E" fill-opacity="0.8"/>

  <!-- Code content -->
  <text x="168" y="390" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">import</text>
  <text x="240" y="390" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="13">CryptoKit</text>

  <text x="168" y="420" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="13">// ECDH Key Agreement</text>

  <text x="168" y="450" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">let</text>
  <text x="196" y="450" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="13">privateKey</text>
  <text x="300" y="450" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">= P256.KeyAgreement</text>

  <text x="192" y="474" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">.PrivateKey()</text>

  <text x="168" y="510" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">let</text>
  <text x="196" y="510" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="13">shared</text>
  <text x="256" y="510" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">= try privateKey</text>

  <text x="192" y="534" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">.sharedSecretFromKeyAgreement(</text>
  <text x="216" y="558" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="13">with:</text>
  <text x="268" y="558" fill="#FDE68A" font-family="JetBrains Mono, monospace" font-size="13">vehiclePublicKey</text>
  <text x="192" y="582" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">)</text>

  <text x="168" y="618" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="13">// AES-GCM Encryption</text>

  <text x="168" y="648" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">let</text>
  <text x="196" y="648" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="13">sealed</text>
  <text x="252" y="648" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">= try AES.GCM.seal(</text>

  <text x="192" y="672" fill="#FDE68A" font-family="JetBrains Mono, monospace" font-size="13">command</text>
  <text x="260" y="672" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">, using:</text>
  <text x="340" y="672" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="13">sessionKey</text>
  <text x="192" y="696" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="13">)</text>

  <!-- Right side: architecture diagram -->
  <g transform="translate(720, 320)">
    <!-- Flow boxes -->
    <rect x="60" y="20" width="180" height="44" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="150" y="48" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="600">BLE Scan</text>

    <line x1="150" y1="64" x2="150" y2="90" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="60" y="90" width="180" height="44" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <text x="150" y="118" text-anchor="middle" fill="#818CF8" font-family="monospace" font-size="14" font-weight="600">ECDH Exchange</text>

    <line x1="150" y1="134" x2="150" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="60" y="160" width="180" height="44" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="150" y="188" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="14" font-weight="600">Session Key</text>

    <line x1="150" y1="204" x2="150" y2="230" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="60" y="230" width="180" height="44" rx="10" fill="#0F172A" stroke="#F472B6" stroke-width="1.5"/>
    <text x="150" y="258" text-anchor="middle" fill="#F472B6" font-family="monospace" font-size="14" font-weight="600">Challenge-Response</text>

    <line x1="150" y1="274" x2="150" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="60" y="300" width="180" height="44" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <text x="150" y="328" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="14" font-weight="600">AES-GCM Command</text>

    <line x1="150" y1="344" x2="150" y2="370" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>

    <rect x="60" y="370" width="180" height="44" rx="10" fill="#0F172A" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="150" y="398" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-size="14" font-weight="600">Vehicle Unlock</text>

    <!-- Side labels -->
    <text x="280" y="48" fill="#475569" font-family="monospace" font-size="11">CoreBluetooth</text>
    <text x="280" y="118" fill="#475569" font-family="monospace" font-size="11">CryptoKit P-256</text>
    <text x="280" y="188" fill="#475569" font-family="monospace" font-size="11">HKDF-SHA256</text>
    <text x="280" y="258" fill="#475569" font-family="monospace" font-size="11">ECDSA Signature</text>
    <text x="280" y="328" fill="#475569" font-family="monospace" font-size="11">SwiftProtobuf</text>
    <text x="280" y="398" fill="#475569" font-family="monospace" font-size="11">Secure Enclave</text>
  </g>

  <!-- Title -->
  <text x="800" y="180" text-anchor="middle" fill="#F8FAFC" font-family="'PingFang SC', 'SF Pro Display', sans-serif" font-size="52" font-weight="700">Swift Tesla BLE Key</text>
  <text x="800" y="230" text-anchor="middle" fill="#94A3B8" font-family="'PingFang SC', 'SF Pro Display', sans-serif" font-size="20">ECDH · AES-GCM · protobuf · Session · CoreBluetooth</text>

  <!-- Bottom tech badges -->
  <g transform="translate(140, 760)">
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="50" y="19" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">Swift</text>

    <rect x="120" y="0" width="130" height="28" rx="6" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="185" y="19" text-anchor="middle" fill="#818CF8" font-family="monospace" font-size="12" font-weight="600">CryptoKit</text>

    <rect x="270" y="0" width="160" height="28" rx="6" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
    <text x="350" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12" font-weight="600">CoreBluetooth</text>

    <rect x="450" y="0" width="130" height="28" rx="6" fill="#F472B6" fill-opacity="0.15" stroke="#F472B6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="515" y="19" text-anchor="middle" fill="#F472B6" font-family="monospace" font-size="12" font-weight="600">protobuf</text>

    <rect x="600" y="0" width="100" height="28" rx="6" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <text x="650" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12" font-weight="600">Actor</text>
  </g>
</svg>
