  <path d="M1350 400C1355 390 1365 390 1368 400C1371 410 1362 415 1356 412C1350 409 1347 406 1350 400Z" fill="#F48FB1" opacity="0.55"/>
  <path d="M450 600C455 590 465 590 468 600C471 610 462 615 456 612C450 609 447 606 450 600Z" fill="#F8BBD0" opacity="0.5"/>
