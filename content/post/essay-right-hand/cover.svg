<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E1"/>
      <stop offset="0.7" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FFD54F"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="1250" cy="300" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8F00" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFF8E1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="300" r="350" fill="url(#sunGlow)"/>
  <!-- Sunset window -->
  <rect x="950" y="120" width="420" height="520" rx="15" stroke="#E65100" stroke-width="2.5" fill="none" opacity="0.3"/>
  <line x1="1160" y1="120" x2="1160" y2="640" stroke="#E65100" stroke-width="1.5" opacity="0.2"/>
  <line x1="950" y1="380" x2="1370" y2="380" stroke="#E65100" stroke-width="1.5" opacity="0.2"/>
  <!-- Warm light through window -->
  <path d="M970 140L1350 140L1250 800L870 800Z" fill="#FF8F00" opacity="0.06"/>
  <!-- Hand shadow silhouette -->
  <g transform="translate(1050, 380)" opacity="0.2">
    <path d="M0 100C5 80 8 50 10 30C12 15 10 5 7 8C5 15 5 40 4 60
             L0 60C2 35 0 8 -3 0C-6 -6 -10 -3 -8 5C-6 18 -2 42 0 60
             L-5 60C-6 35 -10 8 -14 0C-17 -6 -20 -2 -18 5C-15 20 -9 45 -7 60
             L-12 60C-14 42 -20 15 -24 7C-27 0 -30 4 -28 10C-25 24 -16 48 -13 65
             L-18 65C-21 50 -30 28 -35 22C-38 16 -42 20 -40 27C-36 38 -24 58 -20 72
             C-14 92 -8 110 0 100Z" fill="#E65100"/>
  </g>
  <!-- Warm light rays -->
  <line x1="1250" y1="300" x2="600" y2="500" stroke="#FF8F00" stroke-width="1" opacity="0.1"/>
  <line x1="1250" y1="300" x2="500" y2="700" stroke="#FF8F00" stroke-width="1" opacity="0.08"/>
  <line x1="1250" y1="300" x2="800" y2="800" stroke="#FFD54F" stroke-width="1" opacity="0.1"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="250" r="70" fill="#FFD54F" opacity="0.2" filter="url(#soft)"/>
  <circle cx="400" cy="650" r="55" fill="#FF8F00" opacity="0.12" filter="url(#soft)"/>
  <circle cx="700" cy="180" r="50" fill="#FFF8E1" opacity="0.4" filter="url(#soft)"/>
  <circle cx="150" cy="600" r="45" fill="#FFE082" opacity="0.2" filter="url(#soft)"/>
  <circle cx="600" cy="750" r="65" fill="#FFD54F" opacity="0.15" filter="url(#soft)"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#E65100" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">我的右手像一头驴</text>
  <text x="800" y="500" text-anchor="middle" fill="#BF360C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">它什么都记得</text>
</svg>
