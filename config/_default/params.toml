mainSections   = ["post"]
rssFullContent = true
favicon        = "img/favicon.png"

ShowReadingTime     = true
ShowCodeCopyButtons = true
ShowPostNavLinks    = true
ShowBreadCrumbs     = true

[footer]
    since = 2016

[sidebar]
    compact = false
    emoji   = "☕️"
    avatar  = "img/avatar.png"

[article]
    math        = false
    toc         = true
    readingTime = true

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled = true
    provider = "giscus"

    [comments.giscus]
        repo             = "misakatao/blog"
        repoID           = "R_kgDOSJkMlA"
        category         = "Announcements"
        categoryID       = "DIC_kwDOSJkMlM4C7xq_"
        mapping          = "pathname"
        strict           = "0"
        reactionsEnabled = "1"
        emitMetadata     = "0"
        inputPosition    = "bottom"
        lightTheme       = "light"
        darkTheme        = "dark"
        lang             = "zh-CN"
        loading          = "lazy"
