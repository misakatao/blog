<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBE9E7"/>
      <stop offset="0.5" stop-color="#FFCCBC"/>
      <stop offset="1" stop-color="#FFAB91"/>
    </linearGradient>
    <radialGradient id="sunPatch" cx="900" cy="500" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFAB91" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)"/>
  <!-- Sunlight patch -->
  <ellipse cx="900" cy="520" rx="350" ry="200" fill="url(#sunPatch)"/>
  <!-- Blanket edge - soft folds -->
  <path d="M200 580C400 560 700 555 1000 565C1200 572 1400 585 1500 590" stroke="#FFAB91" stroke-width="3" opacity="0.5" fill="none"/>
  <path d="M150 620C400 600 750 595 1100 605C1300 612 1450 625 1550 630" stroke="#FFAB91" stroke-width="2" opacity="0.35" fill="none"/>
  <path d="M100 660C350 645 700 640 1050 648C1250 654 1400 665 1600 670" stroke="#BF360C" stroke-width="1.5" opacity="0.15" fill="none"/>
  <!-- Soft blanket shape -->
  <path d="M100 620C300 600 700 590 1100 600C1350 608 1500 620 1600 630V900H0V660Z" fill="#FFAB91" opacity="0.25"/>
  <!-- Warm light glow -->
  <circle cx="950" cy="400" r="180" fill="#FFF8E1" opacity="0.3" filter="url(#soft)"/>
  <!-- Decorative circles -->
  <circle cx="250" cy="200" r="80" fill="#FFAB91" opacity="0.15" filter="url(#soft)"/>
  <circle cx="1350" cy="180" r="100" fill="#FBE9E7" opacity="0.4" filter="url(#soft)"/>
  <circle cx="400" cy="700" r="60" fill="#BF360C" opacity="0.08" filter="url(#soft)"/>
  <circle cx="1200" cy="650" r="90" fill="#FFCCBC" opacity="0.2" filter="url(#soft)"/>
  <circle cx="700" cy="150" r="50" fill="#FFAB91" opacity="0.2"/>
  <!-- Floating particles -->
  <circle cx="500" cy="300" r="4" fill="#BF360C" opacity="0.15"/>
  <circle cx="1100" cy="250" r="3" fill="#BF360C" opacity="0.12"/>
  <circle cx="300" cy="450" r="3.5" fill="#FFAB91" opacity="0.2"/>
  <circle cx="1300" cy="400" r="4" fill="#FFAB91" opacity="0.18"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#BF360C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">无题</text>
  <text x="800" y="500" text-anchor="middle" fill="#BF360C" fill-opacity="0.65" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">她的脚不喜欢被看见</text>
</svg>
