<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightBg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.45" stop-color="#1B4F72"/>
      <stop offset="0.8" stop-color="#5B8DB8"/>
      <stop offset="1" stop-color="#3A7090"/>
    </linearGradient>
    <linearGradient id="water" x1="800" y1="550" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B4F72" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#nightBg)"/>
  <!-- Stars -->
  <circle cx="120" cy="55" r="2" fill="white" opacity="0.6"/>
  <circle cx="350" cy="38" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="600" cy="50" r="2" fill="white" opacity="0.55"/>
  <circle cx="880" cy="42" r="1.5" fill="white" opacity="0.48"/>
  <circle cx="1150" cy="60" r="2" fill="white" opacity="0.52"/>
  <circle cx="1420" cy="45" r="1.5" fill="white" opacity="0.55"/>
  <!-- Wood grain texture (upper half) -->
  <path d="M200 300C400 295 700 305 1000 298C1300 291 1500 300 1600 295" stroke="#8B6B4A" stroke-width="2" opacity="0.2"/>
  <path d="M0 340C300 335 600 345 900 338C1200 331 1400 340 1600 335" stroke="#6B5030" stroke-width="1.5" opacity="0.18"/>
  <path d="M100 380C400 375 700 385 1000 378C1300 371 1500 380 1600 375" stroke="#8B6B4A" stroke-width="1.5" opacity="0.15"/>
  <path d="M0 420C350 415 650 425 950 418C1250 411 1500 420 1600 415" stroke="#6B5030" stroke-width="1" opacity="0.12"/>
  <!-- Transition zone: wood dissolving into water -->
  <path d="M0 500C200 490 500 510 800 495C1100 480 1400 505 1600 500V560C1400 555 1100 540 800 555C500 570 200 550 0 560Z" fill="#1B4F72" opacity="0.5"/>
  <!-- Water surface -->
  <path d="M0 550C300 540 600 555 900 545C1200 535 1500 550 1600 545V900H0Z" fill="url(#water)"/>
  <!-- Water ripples -->
  <path d="M0 580C200 575 400 582 600 576C800 570 1000 578 1200 574" stroke="#5B8DB8" stroke-width="1.5" opacity="0.3"/>
  <path d="M400 620C600 615 800 622 1000 616C1200 610 1400 618 1600 614" stroke="#5B8DB8" stroke-width="1" opacity="0.25"/>
  <path d="M0 660C250 655 500 662 750 656C1000 650 1250 658 1500 654" stroke="#4A7A9A" stroke-width="1" opacity="0.2"/>
  <path d="M200 700C450 695 700 702 950 696C1200 690 1450 698 1600 694" stroke="#4A7A9A" stroke-width="0.8" opacity="0.15"/>
  <!-- Bokeh -->
  <circle cx="250" cy="300" r="50" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1350" cy="320" r="55" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <!-- Atmospheric particles -->
  <circle cx="300" cy="480" r="1.5" fill="#A8D8EA" opacity="0.3"/>
  <circle cx="650" cy="520" r="1" fill="#A8D8EA" opacity="0.25"/>
  <circle cx="1000" cy="490" r="1.5" fill="#A8D8EA" opacity="0.28"/>
  <circle cx="1300" cy="530" r="1" fill="#A8D8EA" opacity="0.22"/>
  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="80" font-weight="700">睡（二）</text>
  <text x="118" y="192" fill="#C8D8F0" fill-opacity="0.80" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="28">这是木头，遇见水之后的命</text>
</svg>
