<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9C4"/>
      <stop offset="0.4" stop-color="#FFECB3"/>
      <stop offset="0.7" stop-color="#E1BEE7"/>
      <stop offset="1" stop-color="#B2EBF2"/>
    </linearGradient>
    <filter id="soft5"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg5)"/>
  <!-- Colorful bokeh background -->
  <circle cx="200" cy="150" r="100" fill="#E1BEE7" opacity="0.25" filter="url(#soft5)"/>
  <circle cx="1400" cy="180" r="120" fill="#B2EBF2" opacity="0.25" filter="url(#soft5)"/>
  <circle cx="400" cy="700" r="80" fill="#FFECB3" opacity="0.3" filter="url(#soft5)"/>
  <circle cx="1200" cy="720" r="90" fill="#E1BEE7" opacity="0.2" filter="url(#soft5)"/>
  <circle cx="800" cy="800" r="70" fill="#B2EBF2" opacity="0.25" filter="url(#soft5)"/>
  <!-- Polaroid 1 (tilted left) -->
  <g transform="translate(250,280) rotate(-8)">
    <rect x="0" y="0" width="240" height="280" rx="4" fill="white" opacity="0.9"/>
    <rect x="15" y="15" width="210" height="210" rx="2" fill="#B2EBF2" opacity="0.5"/>
    <circle cx="160" cy="80" r="30" fill="#FFF9C4" opacity="0.6"/>
    <path d="M50 150L90 120L130 145L170 100L200 140V210H30V170Z" fill="#E1BEE7" opacity="0.4"/>
  </g>
  <!-- Polaroid 2 (center, straight) -->
  <g transform="translate(650,250) rotate(3)">
    <rect x="0" y="0" width="260" height="300" rx="4" fill="white" opacity="0.9"/>
    <rect x="15" y="15" width="230" height="230" rx="2" fill="#FFECB3" opacity="0.5"/>
    <circle cx="115" cy="100" r="35" fill="#E1BEE7" opacity="0.5"/>
    <rect x="60" y="160" width="140" height="12" rx="6" fill="#B2EBF2" opacity="0.4"/>
    <rect x="80" y="182" width="100" height="10" rx="5" fill="#B2EBF2" opacity="0.3"/>
  </g>
  <!-- Polaroid 3 (tilted right) -->
  <g transform="translate(1050,300) rotate(6)">
    <rect x="0" y="0" width="240" height="280" rx="4" fill="white" opacity="0.9"/>
    <rect x="15" y="15" width="210" height="210" rx="2" fill="#E1BEE7" opacity="0.4"/>
    <circle cx="105" cy="90" r="25" fill="#FFECB3" opacity="0.5"/>
    <path d="M40 130L80 110L120 135L160 95L195 130V210H30V160Z" fill="#B2EBF2" opacity="0.35"/>
  </g>
  <!-- Film strip at bottom -->
  <rect x="0" y="780" width="1600" height="50" rx="4" fill="#4A148C" opacity="0.1"/>
  <g fill="#4A148C" opacity="0.08">
    <rect x="40" y="790" width="16" height="30" rx="3"/>
    <rect x="68" y="790" width="16" height="30" rx="3"/>
    <rect x="96" y="790" width="16" height="30" rx="3"/>
    <rect x="124" y="790" width="16" height="30" rx="3"/>
    <rect x="180" y="790" width="16" height="30" rx="3"/>
    <rect x="208" y="790" width="16" height="30" rx="3"/>
    <rect x="236" y="790" width="16" height="30" rx="3"/>
    <rect x="264" y="790" width="16" height="30" rx="3"/>
  </g>
  <!-- Floating particles -->
  <circle cx="550" cy="180" r="4" fill="#E1BEE7" opacity="0.3"/>
  <circle cx="1000" cy="150" r="3" fill="#B2EBF2" opacity="0.25"/>
  <circle cx="150" cy="500" r="3.5" fill="#FFECB3" opacity="0.3"/>
  <circle cx="1450" cy="500" r="4" fill="#E1BEE7" opacity="0.2"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#4A148C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">相册 · 2016-2018</text>
  <text x="800" y="500" text-anchor="middle" fill="#4A148C" fill-opacity="0.55" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">那些年留下的光影碎片</text>
</svg>
