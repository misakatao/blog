    <rect x="58" y="132" width="380" height="14" rx="7" fill="#94A3B8" fill-opacity="0.2"/>

    <text x="58" y="174" fill="#6EE7B7" font-family="monospace" font-size="16" fill-opacity="0.95">$</text>
