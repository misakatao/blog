<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCE4EC"/>
      <stop offset="0.4" stop-color="#F8BBD0"/>
      <stop offset="1" stop-color="#F48FB1"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="350" r="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FCE4EC" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="breeze"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="350" r="400" fill="url(#glow)"/>

  <!-- Cherry blossom tree trunk and branches -->
  <path d="M250 900C260 800 270 700 290 620C310 540 340 480 380 430C420 380 450 360 500 340" stroke="#6D4C41" stroke-width="18" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M380 430C350 380 330 320 340 260C350 200 380 160 420 130" stroke="#6D4C41" stroke-width="10" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M500 340C540 310 580 290 630 270C680 250 730 240 780 235" stroke="#6D4C41" stroke-width="8" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M420 130C460 100 510 85 570 80" stroke="#6D4C41" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M340 260C310 220 300 180 310 140" stroke="#6D4C41" stroke-width="5" fill="none" opacity="0.35" stroke-linecap="round"/>

  <!-- Blossom clusters on branches -->
  <circle cx="500" cy="330" r="25" fill="#F8BBD0" opacity="0.6"/>
  <circle cx="530" cy="310" r="20" fill="#F48FB1" opacity="0.5"/>
  <circle cx="480" cy="310" r="18" fill="#FCE4EC" opacity="0.65"/>
  <circle cx="630" cy="260" r="22" fill="#F8BBD0" opacity="0.55"/>
  <circle cx="660" cy="240" r="18" fill="#F48FB1" opacity="0.5"/>
  <circle cx="750" cy="230" r="20" fill="#FCE4EC" opacity="0.6"/>
  <circle cx="420" cy="125" r="22" fill="#F8BBD0" opacity="0.55"/>
  <circle cx="460" cy="100" r="18" fill="#F48FB1" opacity="0.5"/>
  <circle cx="560" cy="80" r="20" fill="#FCE4EC" opacity="0.55"/>
  <circle cx="340" cy="255" r="18" fill="#F8BBD0" opacity="0.5"/>
  <circle cx="310" cy="140" r="16" fill="#F48FB1" opacity="0.45"/>

  <!-- Falling petals -->
  <path d="M600 350C606 344 614 346 612 354C610 362 603 360 600 350Z" fill="#F48FB1" opacity="0.75"/>
  <path d="M750 300C756 294 764 296 762 304C760 312 753 310 750 300Z" fill="#F8BBD0" opacity="0.65"/>
  <path d="M900 380C906 374 914 376 912 384C910 392 903 390 900 380Z" fill="#F48FB1" opacity="0.6"/>
  <path d="M1050 320C1056 314 1064 316 1062 324C1060 332 1053 330 1050 320Z" fill="#FCE4EC" opacity="0.7"/>
  <path d="M1200 400C1206 394 1214 396 1212 404C1210 412 1203 410 1200 400Z" fill="#F48FB1" opacity="0.55"/>
  <path d="M850 250C856 244 864 246 862 254C860 262 853 260 850 250Z" fill="#F8BBD0" opacity="0.6"/>
  <path d="M1100 500C1106 494 1114 496 1112 504C1110 512 1103 510 1100 500Z" fill="#F48FB1" opacity="0.45"/>
  <path d="M700 550C706 544 714 546 712 554C710 562 703 560 700 550Z" fill="#F8BBD0" opacity="0.4"/>
  <path d="M1300 280C1306 274 1314 276 1312 284C1310 292 1303 290 1300 280Z" fill="#FCE4EC" opacity="0.6"/>

  <!-- Umbrella edge (top-right) -->
  <path d="M1100 50C1150 30 1250 15 1350 15C1450 15 1530 25 1580 50C1585 58 1560 65 1350 65C1140 65 1095 58 1100 50Z" fill="#AD1457" opacity="0.35"/>
  <path d="M1340 65L1340 120" stroke="#6D4C41" stroke-width="3" opacity="0.3"/>

  <!-- Two shadows on ground - close together -->
  <ellipse cx="780" cy="800" rx="50" ry="15" fill="#880E4F" opacity="0.12"/>
  <ellipse cx="840" cy="800" rx="45" ry="14" fill="#880E4F" opacity="0.12"/>
  <!-- Shadow figures (simple, overlapping) -->
  <ellipse cx="790" cy="780" rx="18" ry="45" fill="#880E4F" opacity="0.08"/>
  <ellipse cx="830" cy="780" rx="16" ry="42" fill="#880E4F" opacity="0.08"/>

  <!-- Spring breeze lines -->
  <path d="M950 200C1000 195 1050 200 1100 195" stroke="#F48FB1" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M1000 250C1050 248 1100 252 1150 248" stroke="#F8BBD0" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M1050 350C1100 348 1150 352 1200 348" stroke="#F48FB1" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#880E4F" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">亲嘴</text>
  <text x="800" y="500" text-anchor="middle" fill="#AD1457" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">她跟我亲嘴，多亲一会就湿了</text>
</svg>
