<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.5" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#5B8DB8"/>
    </linearGradient>
    <linearGradient id="light" x1="1100" y1="200" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E6CA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1B4F72" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Afternoon light beam from window -->
  <path d="M1050 150L1350 150L1200 900L850 900Z" fill="url(#light)"/>

  <!-- Window frame -->
  <rect x="1020" y="120" width="360" height="480" rx="4" stroke="#5B8DB8" stroke-width="2" fill="none" opacity="0.3"/>
  <line x1="1200" y1="120" x2="1200" y2="600" stroke="#5B8DB8" stroke-width="1.5" opacity="0.25"/>
  <line x1="1020" y1="360" x2="1380" y2="360" stroke="#5B8DB8" stroke-width="1.5" opacity="0.25"/>

  <!-- Window warm glow -->
  <rect x="1025" y="125" width="170" height="230" fill="#F5E6CA" opacity="0.06"/>
  <rect x="1205" y="125" width="170" height="230" fill="#F5E6CA" opacity="0.05"/>
  <rect x="1025" y="365" width="170" height="230" fill="#F5E6CA" opacity="0.04"/>
  <rect x="1205" y="365" width="170" height="230" fill="#F5E6CA" opacity="0.035"/>

  <!-- Girl silhouette against window light -->
  <g transform="translate(1100, 280)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="#0A1220"/>
    <path d="M-20 32L-35 180L35 180L20 32Z" fill="#0A1220"/>
    <path d="M-28 -10C-35 -30 -30 -50 -15 -55C0 -58 15 -55 25 -45C32 -38 35 -25 30 -10" fill="#0A1220"/>
    <path d="M-35 180L-40 320L40 320L35 180Z" fill="#0A1220"/>
  </g>

  <!-- Dust particles in light -->
  <g fill="#F5E6CA" opacity="0.25">
    <circle cx="1080" cy="350" r="1.5"/>
    <circle cx="1150" cy="420" r="1"/>
    <circle cx="1050" cy="500" r="1.5"/>
    <circle cx="1130" cy="550" r="1"/>
    <circle cx="1180" cy="650" r="1.5"/>
    <circle cx="1060" cy="700" r="1"/>
  </g>

  <!-- Rain streaks outside window -->
  <g stroke="#7FBCD2" stroke-width="0.6" opacity="0.1">
    <line x1="200" y1="0" x2="195" y2="900"/>
    <line x1="400" y1="0" x2="395" y2="900"/>
    <line x1="550" y1="0" x2="545" y2="900"/>
    <line x1="700" y1="0" x2="695" y2="900"/>
    <line x1="850" y1="0" x2="845" y2="900"/>
    <line x1="1450" y1="0" x2="1445" y2="900"/>
    <line x1="1550" y1="0" x2="1545" y2="900"/>
  </g>

  <!-- Ground -->
  <path d="M0 800C400 790 800 795 1600 800V900H0Z" fill="#081018" opacity="0.7"/>

  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="80" font-weight="700">好看</text>
  <text x="118" y="172" fill="#FFFFFF" fill-opacity="0.78" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="28">她那时候是真好看</text>
</svg>
