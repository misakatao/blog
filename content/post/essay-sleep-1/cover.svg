<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EAF6"/>
      <stop offset="0.6" stop-color="#C5CAE9"/>
      <stop offset="1" stop-color="#9FA8DA"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="1200" cy="200" r="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E8EAF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1200" cy="200" r="250" fill="url(#moonGlow)"/>
  <!-- Moon -->
  <circle cx="1200" cy="200" r="55" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="1215" cy="190" r="50" fill="#E8EAF6" opacity="0.5"/>
  <!-- Window with moonlight -->
  <rect x="1000" y="80" width="350" height="450" rx="12" stroke="#5C6BC0" stroke-width="2" fill="none" opacity="0.25"/>
  <line x1="1175" y1="80" x2="1175" y2="530" stroke="#5C6BC0" stroke-width="1.5" opacity="0.18"/>
  <line x1="1000" y1="305" x2="1350" y2="305" stroke="#5C6BC0" stroke-width="1.5" opacity="0.18"/>
  <!-- Moonlight beam -->
  <path d="M1020 100L1330 100L1200 800L900 800Z" fill="#FFFFFF" opacity="0.04"/>
  <!-- Bed -->
  <path d="M200 650C400 640 700 635 1000 640C1200 644 1350 650 1450 655" stroke="#5C6BC0" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Single pillow -->
  <ellipse cx="380" cy="630" rx="110" ry="28" fill="#C5CAE9" opacity="0.4"/>
  <!-- Blanket folds -->
  <path d="M250 660C450 648 700 642 950 650C1100 656 1250 662 1400 668" stroke="#9FA8DA" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M300 680C500 670 750 665 1000 672" stroke="#7986CB" stroke-width="1.5" fill="none" opacity="0.2"/>
  <!-- Decorative circles -->
  <circle cx="250" cy="300" r="75" fill="#C5CAE9" opacity="0.2" filter="url(#soft)"/>
  <circle cx="500" cy="500" r="55" fill="#9FA8DA" opacity="0.15" filter="url(#soft)"/>
  <circle cx="1400" cy="650" r="65" fill="#7986CB" opacity="0.12" filter="url(#soft)"/>
  <circle cx="700" cy="200" r="40" fill="#E8EAF6" opacity="0.3" filter="url(#soft)"/>
  <circle cx="150" cy="700" r="50" fill="#C5CAE9" opacity="0.18" filter="url(#soft)"/>
  <!-- Small stars -->
  <circle cx="1050" cy="150" r="3" fill="#5C6BC0" opacity="0.4"/>
  <circle cx="1300" cy="120" r="2.5" fill="#7986CB" opacity="0.5"/>
  <circle cx="1100" cy="250" r="2" fill="#9FA8DA" opacity="0.4"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#1A237E" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">睡（一）</text>
  <text x="800" y="500" text-anchor="middle" fill="#283593" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">半夜伸手，摸到的是空的被窝</text>
</svg>
