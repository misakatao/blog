<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3E0"/>
      <stop offset="0.5" stop-color="#FFE0B2"/>
      <stop offset="1" stop-color="#FFAB91"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="1100" cy="300" r="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1100" cy="300" r="350" fill="url(#sunlight)"/>

  <!-- Window frame with warm light -->
  <rect x="1050" y="150" width="350" height="500" rx="8" stroke="#BF360C" stroke-width="2" fill="#FFF8E1" opacity="0.3"/>
  <line x1="1225" y1="150" x2="1225" y2="650" stroke="#BF360C" stroke-width="1.5" opacity="0.3"/>
  <line x1="1050" y1="400" x2="1400" y2="400" stroke="#BF360C" stroke-width="1.5" opacity="0.3"/>

  <!-- Autumn leaves scattered -->
  <path d="M300 200C310 185 325 185 330 200C335 215 320 225 310 220C300 215 295 210 300 200Z" fill="#FF8A65" opacity="0.7"/>
  <path d="M500 350C508 338 520 340 522 352C524 364 514 370 506 366C498 362 495 358 500 350Z" fill="#FFAB91" opacity="0.6"/>
  <path d="M200 500C208 488 220 490 222 502C224 514 214 520 206 516C198 512 195 508 200 500Z" fill="#FF7043" opacity="0.5"/>
  <path d="M1450 400C1458 388 1470 390 1472 402C1474 414 1464 420 1456 416C1448 412 1445 408 1450 400Z" fill="#FF8A65" opacity="0.6"/>
  <path d="M400 700C408 688 420 690 422 702C424 714 414 720 406 716C398 712 395 708 400 700Z" fill="#FFAB91" opacity="0.5"/>

  <!-- Decorative bokeh circles (warm afternoon light) -->
  <circle cx="250" cy="150" r="50" fill="#FFAB91" opacity="0.15"/>
  <circle cx="1450" cy="200" r="40" fill="#FF8A65" opacity="0.12"/>
  <circle cx="150" cy="400" r="35" fill="#FFE0B2" opacity="0.25"/>
  <circle cx="600" cy="150" r="55" fill="#FFF3E0" opacity="0.3"/>
  <circle cx="1300" cy="700" r="45" fill="#FFAB91" opacity="0.15"/>

  <!-- Light dust particles -->
  <circle cx="1100" cy="250" r="2" fill="#FFF8E1" opacity="0.6"/>
  <circle cx="1150" cy="350" r="1.5" fill="#FFF8E1" opacity="0.5"/>
  <circle cx="1080" cy="450" r="2" fill="#FFF8E1" opacity="0.4"/>
  <circle cx="1200" cy="500" r="1.5" fill="#FFF8E1" opacity="0.5"/>
  <circle cx="1130" cy="550" r="2" fill="#FFF8E1" opacity="0.35"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#BF360C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">好看</text>
  <text x="800" y="500" text-anchor="middle" fill="#D84315" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">她那时候是真好看</text>
</svg>
