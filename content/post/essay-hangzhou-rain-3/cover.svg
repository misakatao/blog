<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECEFF1"/>
      <stop offset="0.5" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#90A4AE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="400" cy="500" r="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAB40" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFAB40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1100" cy="400" r="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7043" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="700" cy="650" r="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66BB6A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#66BB6A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Glass texture overlay -->
  <rect width="1600" height="900" fill="#B0BEC5" opacity="0.08"/>

  <!-- Rain streaks on glass -->
  <g stroke="#78909C" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <path d="M300 50C305 150 298 280 310 400C315 450 308 520 312 600" fill="none"/>
    <path d="M550 80C548 180 555 300 550 420C547 500 553 580 548 700" fill="none"/>
    <path d="M900 30C905 130 898 250 903 380C907 460 900 550 905 680" fill="none"/>
    <path d="M1200 60C1198 160 1205 290 1200 410C1197 490 1203 570 1198 700" fill="none"/>
    <path d="M1450 90C1453 190 1448 310 1455 440C1458 520 1450 600 1455 720" fill="none"/>
  </g>

  <!-- Blurred city lights behind glass -->
  <circle cx="400" cy="500" r="80" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="1100" cy="400" r="60" fill="url(#glow2)" filter="url(#blur)"/>
  <circle cx="700" cy="650" r="50" fill="url(#glow3)" filter="url(#blur)"/>
  <circle cx="1350" cy="600" r="45" fill="#42A5F5" opacity="0.15" filter="url(#blur)"/>
  <circle cx="250" cy="350" r="35" fill="#FFCA28" opacity="0.15" filter="url(#blur)"/>

  <!-- Small water droplets on glass -->
  <circle cx="200" cy="200" r="5" fill="#B0BEC5" opacity="0.4"/>
  <circle cx="450" cy="300" r="4" fill="#B0BEC5" opacity="0.35"/>
  <circle cx="750" cy="180" r="6" fill="#B0BEC5" opacity="0.4"/>
  <circle cx="1000" cy="250" r="4" fill="#B0BEC5" opacity="0.3"/>
  <circle cx="1300" cy="300" r="5" fill="#B0BEC5" opacity="0.35"/>
  <circle cx="350" cy="600" r="4" fill="#B0BEC5" opacity="0.3"/>
  <circle cx="1150" cy="650" r="5" fill="#B0BEC5" opacity="0.35"/>

  <!-- Decorative bokeh circles -->
  <circle cx="150" cy="100" r="40" fill="#78909C" opacity="0.1"/>
  <circle cx="1500" cy="150" r="55" fill="#90A4AE" opacity="0.12"/>
  <circle cx="100" cy="700" r="35" fill="#CFD8DC" opacity="0.2"/>
  <circle cx="1450" cy="750" r="45" fill="#78909C" opacity="0.1"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#263238" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">杭州的雨（三）</text>
  <text x="800" y="500" text-anchor="middle" fill="#37474F" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">雨是多情的贼</text>
</svg>
