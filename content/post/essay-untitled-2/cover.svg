<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDE7"/>
      <stop offset="0.5" stop-color="#FFF9C4"/>
      <stop offset="1" stop-color="#FFF59D"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="1100" cy="300" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFF59D" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
