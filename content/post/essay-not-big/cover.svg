<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.5" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#5B8DB8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="1200" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E6CA" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1200" cy="200" r="200" fill="url(#moonGlow)"/>

  <!-- Moon -->
  <circle cx="1200" cy="200" r="45" fill="#F5E6CA" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1200" cy="200" r="22" fill="#F5E6CA" opacity="0.5"/>

  <!-- Window frame (bedroom) -->
  <rect x="900" y="150" width="400" height="500" rx="3" stroke="#5B8DB8" stroke-width="1.5" fill="none" opacity="0.2"/>
  <line x1="1100" y1="150" x2="1100" y2="650" stroke="#5B8DB8" stroke-width="1" opacity="0.15"/>
  <line x1="900" y1="400" x2="1300" y2="400" stroke="#5B8DB8" stroke-width="1" opacity="0.15"/>

  <!-- Moonlight through window -->
  <path d="M920 170L1280 170L1200 850L840 850Z" fill="#F5E6CA" opacity="0.03"/>

  <!-- Bed silhouette -->
  <g opacity="0.35">
    <path d="M300 650C350 640 500 635 700 640C900 645 1050 650 1100 655L1100 780L300 780Z" fill="#0A1220"/>
    <path d="M300 650L300 680C350 670 450 665 550 668" stroke="#162D44" stroke-width="1" fill="none" opacity="0.5"/>
    <ellipse cx="420" cy="630" rx="100" ry="30" fill="#0A1220"/>
  </g>

  <!-- Soft curves silhouette under blanket -->
  <path d="M450 660C550 640 700 630 850 640C950 648 1000 655 1050 660" stroke="#2A4A6A" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M500 670C600 655 750 648 880 655" stroke="#2A4A6A" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Stars visible through window -->
  <g fill="#FFFFFF">
    <circle cx="950" cy="220" r="1.5" opacity="0.6"/>
    <circle cx="1050" cy="280" r="1" opacity="0.5"/>
    <circle cx="1250" cy="320" r="1.5" opacity="0.5"/>
    <circle cx="1150" cy="250" r="1" opacity="0.4"/>
  </g>

  <!-- Atmospheric particles -->
  <g fill="#7FBCD2" opacity="0.15" filter="url(#glow)">
    <circle cx="500" cy="300" r="2.5"/>
    <circle cx="300" cy="500" r="2"/>
    <circle cx="700" cy="250" r="2"/>
    <circle cx="200" cy="400" r="2.5"/>
  </g>

  <!-- Ground -->
  <path d="M0 830C400 820 800 825 1600 830V900H0Z" fill="#081018" opacity="0.7"/>

  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="80" font-weight="700">不大</text>
  <text x="118" y="172" fill="#FFFFFF" fill-opacity="0.78" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="28">不大和喜欢，是两件事</text>
</svg>
