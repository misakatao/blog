  <circle cx="850" cy="400" r="2" fill="#F57F17" opacity="0.2"/>
  <circle cx="1050" cy="150" r="2" fill="#F57F17" opacity="0.28"/>
  <circle cx="950" cy="500" r="3" fill="#F57F17" opacity="0.18"/>
  <circle cx="1150" cy="250" r="2.5" fill="#F57F17" opacity="0.22"/>
  <circle cx="750" cy="300" r="1.5" fill="#F57F17" opacity="0.2"/>
  <!-- Decorative bokeh -->
  <circle cx="200" cy="200" r="90" fill="#FFF59D" opacity="0.3" filter="url(#soft2)"/>
  <circle cx="1400" cy="600" r="110" fill="#FFF59D" opacity="0.25" filter="url(#soft2)"/>
  <circle cx="500" cy="750" r="70" fill="#F57F17" opacity="0.08" filter="url(#soft2)"/>
  <circle cx="1300" cy="150" r="80" fill="#FFFFFF" opacity="0.3" filter="url(#soft2)"/>
