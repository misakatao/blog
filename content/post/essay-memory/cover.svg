<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3F2FD"/>
      <stop offset="0.5" stop-color="#BBDEFB"/>
      <stop offset="1" stop-color="#90CAF9"/>
    </linearGradient>
    <radialGradient id="puddle" cx="1100" cy="750" r="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64B5F6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#90CAF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Old doorway/wall -->
  <rect x="900" y="200" width="400" height="600" rx="6" fill="#1565C0" opacity="0.1"/>
  <rect x="920" y="220" width="360" height="560" rx="4" fill="#E3F2FD" opacity="0.15"/>
  <path d="M920 220L920 780L1280 780L1280 220L1100 180Z" fill="#1565C0" opacity="0.05"/>

  <!-- Umbrella leaning against wall -->
  <line x1="1050" y1="450" x2="1080" y2="720" stroke="#1565C0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M1080 720C1080 735 1072 740 1066 735" stroke="#1565C0" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M1010 450C1020 430 1040 420 1060 420C1080 420 1095 430 1100 450" stroke="#1565C0" stroke-width="3" fill="#64B5F6" opacity="0.4"/>

  <!-- Small puddle under umbrella -->
  <ellipse cx="1085" cy="750" rx="40" ry="8" fill="url(#puddle)"/>
  <ellipse cx="1085" cy="750" rx="20" ry="4" fill="#64B5F6" opacity="0.2"/>

  <!-- Water drops from umbrella -->
  <circle cx="1082" cy="730" r="2.5" fill="#64B5F6" opacity="0.5"/>
  <circle cx="1084" cy="740" r="2" fill="#64B5F6" opacity="0.4"/>

  <!-- Decorative bokeh circles -->
  <circle cx="200" cy="150" r="50" fill="#90CAF9" opacity="0.15"/>
  <circle cx="1400" cy="120" r="60" fill="#BBDEFB" opacity="0.2"/>
  <circle cx="100" cy="500" r="40" fill="#64B5F6" opacity="0.1"/>
  <circle cx="600" cy="800" r="45" fill="#90CAF9" opacity="0.15"/>
  <circle cx="1500" cy="600" r="35" fill="#BBDEFB" opacity="0.18"/>

  <!-- Soft clouds -->
  <ellipse cx="300" cy="100" rx="130" ry="40" fill="#FFFFFF" opacity="0.3" filter="url(#soft)"/>
  <ellipse cx="700" cy="80" rx="100" ry="30" fill="#FFFFFF" opacity="0.25" filter="url(#soft)"/>

  <!-- Abstract organic shapes (leaves/nature) -->
  <path d="M150 650C160 635 175 635 178 650C181 665 168 670 158 665C148 660 145 655 150 650Z" fill="#64B5F6" opacity="0.3"/>
  <path d="M400 300C408 288 418 290 420 300C422 310 413 315 406 312C399 309 396 305 400 300Z" fill="#90CAF9" opacity="0.25"/>
  <path d="M1400 450C1408 438 1418 440 1420 450C1422 460 1413 465 1406 462C1399 459 1396 455 1400 450Z" fill="#64B5F6" opacity="0.3"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#1565C0" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">回忆</text>
  <text x="800" y="500" text-anchor="middle" fill="#1976D2" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">伞靠在墙角，滴了一夜的水</text>
</svg>
