<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightBg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.45" stop-color="#1B4F72"/>
      <stop offset="0.8" stop-color="#5B8DB8"/>
      <stop offset="1" stop-color="#4A7A9A"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="800" cy="450" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4A870" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1B4F72" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#nightBg)"/>
  <circle cx="800" cy="450" r="300" fill="url(#warmGlow)"/>
  <!-- Stars -->
  <circle cx="100" cy="55" r="2" fill="white" opacity="0.5"/>
  <circle cx="330" cy="38" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="570" cy="52" r="2" fill="white" opacity="0.45"/>
  <circle cx="820" cy="35" r="1.5" fill="white" opacity="0.38"/>
  <circle cx="1100" cy="60" r="2" fill="white" opacity="0.42"/>
  <circle cx="1400" cy="42" r="1.5" fill="white" opacity="0.45"/>
  <!-- Fabric texture (soft draped lines) -->
  <path d="M300 350C500 340 700 355 900 345C1100 335 1300 350 1500 342" stroke="#5B8DB8" stroke-width="1.5" opacity="0.15"/>
  <path d="M250 400C450 390 650 405 850 395C1050 385 1250 400 1450 392" stroke="#5B8DB8" stroke-width="1.2" opacity="0.12"/>
  <path d="M350 450C550 440 750 455 950 445C1150 435 1350 450 1550 442" stroke="#4A7A9A" stroke-width="1" opacity="0.1"/>
  <path d="M200 500C400 490 600 505 800 495C1000 485 1200 500 1400 492" stroke="#4A7A9A" stroke-width="1" opacity="0.08"/>
  <!-- Muted warm light source (off-center) -->
  <circle cx="650" cy="380" r="80" fill="#D4A870" opacity="0.06" filter="url(#blur)"/>
  <circle cx="680" cy="400" r="40" fill="#E8C090" opacity="0.04"/>
  <!-- Floor -->
  <path d="M0 750C400 730 900 738 1600 750V900H0Z" fill="#081420" opacity="0.9"/>
  <!-- Bokeh -->
  <circle cx="200" cy="300" r="50" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1400" cy="320" r="55" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <circle cx="350" cy="600" r="40" fill="#6A8FC5" opacity="0.06" filter="url(#blur)"/>
  <circle cx="1250" cy="580" r="45" fill="#6A8FC5" opacity="0.06" filter="url(#blur)"/>
  <!-- Atmospheric particles -->
  <circle cx="400" cy="350" r="1.5" fill="#D4A870" opacity="0.25"/>
  <circle cx="650" cy="300" r="1" fill="#D4A870" opacity="0.2"/>
  <circle cx="900" cy="380" r="1.5" fill="#A8D8EA" opacity="0.22"/>
  <circle cx="1100" cy="320" r="1" fill="#A8D8EA" opacity="0.2"/>
  <circle cx="500" cy="500" r="1.5" fill="#A8D8EA" opacity="0.18"/>
  <circle cx="1000" cy="480" r="1" fill="#A8D8EA" opacity="0.15"/>
  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="80" font-weight="700">无题（三）</text>
  <text x="118" y="192" fill="#C8D8F0" fill-opacity="0.80" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="28">隔着一层丝袜，比直接摸腿更让人心痒</text>
</svg>
