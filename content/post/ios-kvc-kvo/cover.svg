<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1440" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF"/>
      <stop offset="0.5" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F5F3FF" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#4C1D95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1340" cy="100" r="90" fill="#A78BFA" fill-opacity="0.25"/>
  <circle cx="140" cy="160" r="70" fill="#C4B5FD" fill-opacity="0.3"/>
  <circle cx="1400" cy="780" r="100" fill="#8B5CF6" fill-opacity="0.2"/>

  <g filter="url(#soft)">
    <rect x="110" y="120" width="1380" height="660" rx="36" fill="url(#panel)"/>
  </g>

  <g transform="translate(200,260)">
    <rect x="0" y="0" width="320" height="320" rx="24" fill="#7C3AED"/>
    <text x="160" y="50" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="700">Person *p</text>
    <line x1="28" y1="66" x2="292" y2="66" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

    <rect x="28" y="90" width="264" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <text x="48" y="117" fill="#FFFFFF" font-family="monospace" font-size="15">name: "Alice"</text>

    <rect x="28" y="146" width="264" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <text x="48" y="173" fill="#FFFFFF" font-family="monospace" font-size="15">age: 25</text>

    <rect x="28" y="202" width="264" height="42" rx="8" fill="#FDE68A" fill-opacity="0.3" stroke="#FDE68A" stroke-width="2"/>
    <text x="48" y="229" fill="#FEF9C3" font-family="monospace" font-size="15" font-weight="700">balance: 100 → 200</text>

    <rect x="28" y="258" width="264" height="42" rx="8" fill="#FFFFFF" fill-opacity="0.18"/>
    <text x="48" y="285" fill="#FFFFFF" font-family="monospace" font-size="15">address: "..."</text>
  </g>

  <g transform="translate(600,320)">
    <rect x="0" y="0" width="360" height="60" rx="12" fill="#0F172A"/>
    <text x="180" y="37" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="15">[p setValue:@200 forKey:@"balance"]</text>

    <line x1="180" y1="72" x2="180" y2="120" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="200" y="102" fill="#7C3AED" font-family="monospace" font-size="14" font-weight="600">KVC</text>

    <rect x="0" y="132" width="360" height="60" rx="12" fill="#0F172A"/>
    <text x="180" y="170" text-anchor="middle" fill="#F9A8D4" font-family="monospace" font-size="14">observeValueForKeyPath:ofObject:</text>

    <line x1="180" y1="202" x2="180" y2="248" stroke="#DB2777" stroke-width="3" stroke-dasharray="6,6"/>
    <text x="200" y="232" fill="#DB2777" font-family="monospace" font-size="14" font-weight="600">KVO</text>
  </g>

  <g transform="translate(1040,280)">
    <rect x="0" y="0" width="360" height="280" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="56" rx="20" fill="#DB2777"/>
    <rect x="0" y="32" width="360" height="24" fill="#DB2777"/>
    <text x="28" y="35" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="700">👁  Observer</text>

    <g transform="translate(24,80)">
      <circle cx="12" cy="14" r="6" fill="#DB2777"/>
      <text x="30" y="20" fill="#831843" font-family="monospace" font-size="14">balance changed</text>
      <text x="30" y="38" fill="#9F1239" font-family="monospace" font-size="12">old: 100 → new: 200</text>
    </g>
    <line x1="24" y1="138" x2="336" y2="138" stroke="#FCE7F3" stroke-width="1"/>

    <g transform="translate(24,154)">
      <circle cx="12" cy="14" r="6" fill="#7C3AED"/>
      <text x="30" y="20" fill="#4C1D95" font-family="monospace" font-size="14">isa → NSKVONotifying_Person</text>
      <text x="30" y="38" fill="#5B21B6" font-family="monospace" font-size="12">动态子类 · 方法交换</text>
    </g>
    <line x1="24" y1="212" x2="336" y2="212" stroke="#FCE7F3" stroke-width="1"/>

    <g transform="translate(24,228)">
      <circle cx="12" cy="14" r="6" fill="#0EA5E9"/>
      <text x="30" y="20" fill="#0C4A6E" font-family="monospace" font-size="14">willChange / didChange</text>
    </g>
  </g>

  <text x="800" y="720" text-anchor="middle" fill="#4C1D95" font-family="'PingFang SC', sans-serif" font-size="28" font-weight="700">KVC &amp; KVO · 间接访问与变更观察</text>
</svg>
