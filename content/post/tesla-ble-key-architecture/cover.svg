<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0D9488"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#DC2626"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1380" cy="120" r="100" fill="#6366F1" fill-opacity="0.12"/>
  <circle cx="160" cy="180" r="80" fill="#38BDF8" fill-opacity="0.15"/>
  <circle cx="1420" cy="760" r="90" fill="#DC2626" fill-opacity="0.1"/>
  <circle cx="200" cy="740" r="70" fill="#22D3EE" fill-opacity="0.1"/>

  <!-- Title -->
  <text x="800" y="160" text-anchor="middle" fill="#F8FAFC" font-family="'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="56" font-weight="700">Tesla BLE Key Architecture</text>
  <text x="800" y="210" text-anchor="middle" fill="#94A3B8" font-family="'PingFang SC', 'Hiragino Sans GB', sans-serif" font-size="22">配对流程 · 协议分层 · 密钥安全模型</text>

  <!-- Protocol Layer Stack -->
  <g filter="url(#soft)" transform="translate(200, 270)">
    <!-- Layer 4: Application -->
    <rect x="0" y="0" width="500" height="80" rx="12" fill="url(#layer1)" fill-opacity="0.9" stroke="#818CF8" stroke-width="1"/>
    <text x="250" y="36" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700">Application Layer</text>
    <text x="250" y="60" text-anchor="middle" fill="#E0E7FF" font-family="monospace" font-size="14">Vehicle Commands · Domain Actions</text>

    <!-- Layer 3: Security -->
    <rect x="0" y="100" width="500" height="80" rx="12" fill="url(#layer2)" fill-opacity="0.9" stroke="#60A5FA" stroke-width="1"/>
    <text x="250" y="136" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700">Security Layer</text>
    <text x="250" y="160" text-anchor="middle" fill="#DBEAFE" font-family="monospace" font-size="14">ECC Signing · Session · Challenge-Response</text>

    <!-- Layer 2: Session -->
    <rect x="0" y="200" width="500" height="80" rx="12" fill="url(#layer3)" fill-opacity="0.9" stroke="#5EEAD4" stroke-width="1"/>
    <text x="250" y="236" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700">Session Layer</text>
    <text x="250" y="260" text-anchor="middle" fill="#CCFBF1" font-family="monospace" font-size="14">Handshake · Key Exchange · Epoch</text>

    <!-- Layer 1: Transport -->
    <rect x="0" y="300" width="500" height="80" rx="12" fill="url(#layer4)" fill-opacity="0.9" stroke="#FCA5A5" stroke-width="1"/>
    <text x="250" y="336" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700">Transport Layer</text>
    <text x="250" y="360" text-anchor="middle" fill="#FEE2E2" font-family="monospace" font-size="14">BLE GATT · MTU Fragmentation</text>
  </g>

  <!-- Pairing Flow Diagram -->
  <g transform="translate(820, 300)">
    <!-- Phone -->
    <rect x="0" y="0" width="140" height="220" rx="20" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="12" y="16" width="116" height="188" rx="12" fill="#1E293B"/>
    <rect x="50" y="24" width="40" height="6" rx="3" fill="#475569"/>
    <text x="70" y="100" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">Phone</text>
    <text x="70" y="120" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="600">Key</text>
    <!-- Key icon -->
    <circle cx="70" cy="150" r="16" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <line x1="70" y1="166" x2="70" y2="186" stroke="#38BDF8" stroke-width="2"/>
    <line x1="70" y1="178" x2="78" y2="178" stroke="#38BDF8" stroke-width="2"/>

    <!-- Arrow: Phone -> Tesla Cloud -->
    <line x1="140" y1="60" x2="220" y2="60" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="218,55 228,60 218,65" fill="#6EE7B7"/>
    <text x="180" y="50" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11">register</text>

    <!-- Tesla Cloud -->
    <rect x="230" y="20" width="140" height="80" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="300" y="55" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="600">Tesla Cloud</text>
    <text x="300" y="75" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">Auth Server</text>

    <!-- Arrow: Cloud -> Vehicle -->
    <line x1="300" y1="100" x2="300" y2="150" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="295,148 300,158 305,148" fill="#FDE68A"/>
    <text x="340" y="130" text-anchor="start" fill="#FDE68A" font-family="monospace" font-size="11">approve</text>

    <!-- Vehicle -->
    <rect x="230" y="160" width="140" height="80" rx="12" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
    <text x="300" y="195" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="13" font-weight="600">Vehicle ECU</text>
    <text x="300" y="215" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">Key Whitelist</text>

    <!-- Arrow: Phone <-> Vehicle (BLE) -->
    <line x1="140" y1="180" x2="228" y2="200" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="224,195 230,202 222,203" fill="#38BDF8"/>
    <text x="170" y="204" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11">BLE</text>
  </g>

  <!-- Security badges -->
  <g transform="translate(200, 680)">
    <rect x="0" y="0" width="1200" height="44" rx="10" fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="40" y="28" fill="#818CF8" font-family="monospace" font-size="15" font-weight="600">Secure Enclave</text>
    <text x="220" y="28" fill="#475569" font-family="monospace" font-size="15">│</text>
    <text x="250" y="28" fill="#60A5FA" font-family="monospace" font-size="15" font-weight="600">P-256 ECDH</text>
    <text x="400" y="28" fill="#475569" font-family="monospace" font-size="15">│</text>
    <text x="430" y="28" fill="#5EEAD4" font-family="monospace" font-size="15" font-weight="600">AES-GCM</text>
    <text x="560" y="28" fill="#475569" font-family="monospace" font-size="15">│</text>
    <text x="590" y="28" fill="#FDE68A" font-family="monospace" font-size="15" font-weight="600">HMAC Epoch</text>
    <text x="750" y="28" fill="#475569" font-family="monospace" font-size="15">│</text>
    <text x="780" y="28" fill="#F472B6" font-family="monospace" font-size="15" font-weight="600">Key Rotation</text>
    <text x="940" y="28" fill="#475569" font-family="monospace" font-size="15">│</text>
    <text x="970" y="28" fill="#6EE7B7" font-family="monospace" font-size="15" font-weight="600">Mutual Auth</text>
  </g>
</svg>

