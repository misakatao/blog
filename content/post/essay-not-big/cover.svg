<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E5F5"/>
      <stop offset="1" stop-color="#CE93D8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="1150" cy="200" r="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F3E5F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1150" cy="200" r="250" fill="url(#moonGlow)"/>
  <!-- Moon -->
  <circle cx="1150" cy="200" r="60" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="1165" cy="190" r="55" fill="#F3E5F5" opacity="0.6"/>
  <!-- Stars peeking in -->
  <circle cx="1000" cy="120" r="4" fill="#CE93D8" opacity="0.6"/>
  <circle cx="1300" cy="150" r="3" fill="#AB47BC" opacity="0.5"/>
  <circle cx="1050" cy="280" r="3.5" fill="#CE93D8" opacity="0.5"/>
  <circle cx="1350" cy="250" r="2.5" fill="#AB47BC" opacity="0.4"/>
  <circle cx="900" cy="180" r="3" fill="#E1BEE7" opacity="0.6"/>
  <!-- Window frame -->
  <rect x="880" y="100" width="450" height="550" rx="20" stroke="#AB47BC" stroke-width="2" fill="none" opacity="0.3"/>
  <line x1="1105" y1="100" x2="1105" y2="650" stroke="#AB47BC" stroke-width="1.5" opacity="0.2"/>
  <line x1="880" y1="375" x2="1330" y2="375" stroke="#AB47BC" stroke-width="1.5" opacity="0.2"/>
  <!-- Curtain curves -->
  <path d="M880 100C860 250 870 400 850 550C840 650 860 750 880 650" stroke="#CE93D8" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M1330 100C1350 250 1340 400 1360 550C1370 650 1350 750 1330 650" stroke="#CE93D8" stroke-width="3" fill="none" opacity="0.4"/>
  <!-- Soft bedroom curves (blanket) -->
  <path d="M200 700C400 680 700 670 1000 680C1200 688 1400 700 1500 710" stroke="#AB47BC" stroke-width="2.5" fill="none" opacity="0.25"/>
  <path d="M250 720C450 705 700 698 950 705C1150 712 1350 720 1450 728" stroke="#CE93D8" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- Decorative circles (bokeh) -->
  <circle cx="200" cy="300" r="80" fill="#E1BEE7" opacity="0.2" filter="url(#soft)"/>
  <circle cx="400" cy="600" r="60" fill="#CE93D8" opacity="0.15" filter="url(#soft)"/>
  <circle cx="1400" cy="700" r="70" fill="#E1BEE7" opacity="0.18" filter="url(#soft)"/>
  <circle cx="650" cy="200" r="45" fill="#F3E5F5" opacity="0.3" filter="url(#soft)"/>
  <circle cx="300" cy="750" r="55" fill="#CE93D8" opacity="0.12" filter="url(#soft)"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#4A148C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">不大</text>
  <text x="800" y="500" text-anchor="middle" fill="#6A1B9A" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">不大和喜欢，是两件事</text>
</svg>
