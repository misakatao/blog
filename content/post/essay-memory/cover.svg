<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.5" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#5B8DB8"/>
    </linearGradient>
    <linearGradient id="wall" x1="1100" y1="0" x2="1100" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162D44"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Wall corner -->
  <rect x="1050" y="0" width="550" height="900" fill="url(#wall)" opacity="0.6"/>
  <line x1="1050" y1="0" x2="1050" y2="900" stroke="#5B8DB8" stroke-width="1" opacity="0.15"/>

  <!-- Rain streaks -->
  <g stroke="#7FBCD2" stroke-width="0.6" opacity="0.12">
    <line x1="100" y1="0" x2="95" y2="900"/>
    <line x1="250" y1="0" x2="245" y2="900"/>
    <line x1="420" y1="0" x2="415" y2="900"/>
    <line x1="580" y1="0" x2="575" y2="900"/>
    <line x1="730" y1="0" x2="725" y2="900"/>
    <line x1="880" y1="0" x2="875" y2="900"/>
    <line x1="1000" y1="0" x2="995" y2="900"/>
  </g>

  <!-- Umbrella leaning against wall -->
  <g transform="translate(1100, 350)">
    <line x1="0" y1="0" x2="40" y2="380" stroke="#2A4A6A" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 380C40 400 30 405 22 398" stroke="#2A4A6A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-8 0C-20 -12 -15 -35 0 -28C8 -24 12 -10 -8 0Z" fill="#1B4F72" opacity="0.7"/>
  </g>

  <!-- Water drops from umbrella tip -->
  <circle cx="1140" cy="740" r="2.5" fill="#7FBCD2" opacity="0.5"/>
  <circle cx="1142" cy="760" r="2" fill="#7FBCD2" opacity="0.4"/>
  <circle cx="1141" cy="778" r="1.8" fill="#7FBCD2" opacity="0.3"/>
  <circle cx="1143" cy="795" r="1.5" fill="#7FBCD2" opacity="0.25"/>

  <!-- Small puddle under umbrella -->
  <ellipse cx="1142" cy="820" rx="30" ry="5" fill="#5B8DB8" opacity="0.15"/>
  <ellipse cx="1142" cy="820" rx="18" ry="3" fill="#7FBCD2" opacity="0.1"/>

  <!-- Moonlight glow -->
  <circle cx="400" cy="150" r="50" fill="#F5E6CA" opacity="0.08" filter="url(#glow)"/>
  <circle cx="400" cy="150" r="22" fill="#F5E6CA" opacity="0.4"/>

  <!-- Atmospheric particles -->
  <g fill="#7FBCD2" opacity="0.2" filter="url(#glow)">
    <circle cx="300" cy="400" r="2"/>
    <circle cx="600" cy="300" r="2.5"/>
    <circle cx="500" cy="600" r="2"/>
    <circle cx="800" cy="500" r="2"/>
  </g>

  <!-- Ground with wet reflection -->
  <path d="M0 820C400 810 800 815 1600 820V900H0Z" fill="#081018" opacity="0.75"/>
  <ellipse cx="800" cy="850" rx="200" ry="4" fill="#5B8DB8" opacity="0.08"/>

  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="80" font-weight="700">回忆</text>
  <text x="118" y="172" fill="#FFFFFF" fill-opacity="0.78" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="28">伞靠在墙角，滴了一夜的水</text>
</svg>
