<svg width="250" height="150" viewBox="0 0 250 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="250" height="150" rx="16" fill="#FFF3E0"/>
  <!-- Camera body -->
  <rect x="70" y="45" width="110" height="70" rx="10" fill="#5D4037"/>
  <rect x="75" y="50" width="100" height="60" rx="8" fill="#4E342E"/>
  <!-- Lens -->
  <circle cx="125" cy="80" r="22" fill="#1E293B"/>
  <circle cx="125" cy="80" r="16" fill="#263238"/>
  <circle cx="125" cy="80" r="10" fill="#37474F"/>
  <circle cx="125" cy="80" r="5" fill="#546E7A"/>
  <!-- Lens reflection -->
  <circle cx="120" cy="75" r="3" fill="#FFFFFF" opacity="0.3"/>
  <!-- Viewfinder -->
  <rect x="110" y="38" width="30" height="12" rx="4" fill="#3E2723"/>
  <!-- Shutter button -->
  <circle cx="155" cy="42" r="6" fill="#FF8A65"/>
  <!-- Polaroid photos scattered -->
  <g transform="translate(15,20) rotate(-12)">
    <rect x="0" y="0" width="40" height="48" rx="2" fill="white" opacity="0.8"/>
    <rect x="4" y="4" width="32" height="28" rx="1" fill="#FFCC80" opacity="0.5"/>
  </g>
  <g transform="translate(190,70) rotate(8)">
    <rect x="0" y="0" width="40" height="48" rx="2" fill="white" opacity="0.8"/>
    <rect x="4" y="4" width="32" height="28" rx="1" fill="#B2EBF2" opacity="0.5"/>
  </g>
  <!-- Film strip -->
  <rect x="20" y="125" width="210" height="14" rx="3" fill="#4E342E" opacity="0.15"/>
  <g fill="#4E342E" opacity="0.1">
    <rect x="28" y="128" width="8" height="8" rx="1.5"/>
    <rect x="42" y="128" width="8" height="8" rx="1.5"/>
    <rect x="56" y="128" width="8" height="8" rx="1.5"/>
    <rect x="70" y="128" width="8" height="8" rx="1.5"/>
  </g>
  <!-- Sparkles -->
  <circle cx="30" cy="100" r="2.5" fill="#FFF59D" opacity="0.6"/>
  <circle cx="230" cy="30" r="2" fill="#FFF59D" opacity="0.5"/>
</svg>
