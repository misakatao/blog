<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightBg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060C1E"/>
      <stop offset="0.45" stop-color="#0E1F45"/>
      <stop offset="0.8" stop-color="#1A3060"/>
      <stop offset="1" stop-color="#243870"/>
    </linearGradient>
    <linearGradient id="bedWarm" x1="400" y1="500" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A2040" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1A3060" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="1280" cy="120" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F0FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0E1F45" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#nightBg)"/>
  <circle cx="1280" cy="120" r="200" fill="url(#moonGlow)"/>
  <!-- Moon -->
  <circle cx="1280" cy="120" r="52" fill="#EEF4FF" opacity="0.88"/>
  <circle cx="1300" cy="110" r="52" fill="#0E1F45" opacity="0.82"/>
  <!-- Stars -->
  <circle cx="80" cy="65" r="2" fill="white" opacity="0.6"/>
  <circle cx="260" cy="42" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="480" cy="58" r="2" fill="white" opacity="0.55"/>
  <circle cx="680" cy="35" r="1.5" fill="white" opacity="0.48"/>
  <circle cx="860" cy="52" r="2" fill="white" opacity="0.55"/>
  <circle cx="1040" cy="68" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="1420" cy="45" r="2" fill="white" opacity="0.58"/>
  <circle cx="1520" cy="82" r="1.5" fill="white" opacity="0.48"/>
  <!-- Bokeh -->
  <circle cx="200" cy="380" r="50" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1400" cy="350" r="60" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <!-- Floor -->
  <path d="M0 740C400 720 900 728 1600 740V900H0Z" fill="#0A1428" opacity="0.9"/>
  <path d="M0 820C400 800 900 808 1600 820V900H0Z" fill="#060C1E" opacity="0.8"/>
  <!-- Bed -->
  <g transform="translate(300, 360)">
    <!-- Mattress -->
    <rect x="0" y="260" width="1000" height="35" rx="6" fill="#182848" opacity="0.85"/>
    <!-- Pillow left (used, dented) -->
    <ellipse cx="180" cy="248" rx="120" ry="30" fill="#243870" opacity="0.75"/>
    <!-- Pillow right (untouched, plump) -->
    <ellipse cx="780" cy="244" rx="120" ry="34" fill="#1E3060" opacity="0.55"/>
    <!-- Blanket - warm left side (rumpled) -->
    <path d="M20 258C80 240 280 232 500 248C520 250 500 268 20 278Z" fill="#2A1838" opacity="0.85"/>
    <path d="M20 258C80 240 280 232 500 248" stroke="#3A2848" stroke-width="2" opacity="0.5"/>
    <!-- Blanket - cold right side (flat, undisturbed) -->
    <path d="M500 248C700 240 900 242 980 252L980 272L500 268Z" fill="#1A2E55" opacity="0.7"/>
    <!-- Warm glow on left side -->
    <circle cx="200" cy="250" r="150" fill="#5A2848" opacity="0.12" filter="url(#blur)"/>
    <!-- Hand reaching into empty right side -->
    <path d="M340 252C400 248 460 246 520 250" stroke="#FDDBB4" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <circle cx="524" cy="250" r="9" fill="#FDDBB4" opacity="0.7"/>
  </g>
  <!-- Moonlight beam -->
  <path d="M1200 0L1360 0L1000 900L840 900Z" fill="white" opacity="0.015"/>
  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="80" font-weight="700">睡（一）</text>
  <text x="118" y="192" fill="#C8D8F0" fill-opacity="0.80" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="28">半夜伸手，摸到的是空的被窝</text>
</svg>