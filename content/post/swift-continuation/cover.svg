    <text x="50" y="188" text-anchor="middle" fill="#9A3412" font-family="monospace" font-size="13" font-weight="700">Task 挂起</text>

    <rect x="-10" y="214" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <text x="50" y="242" text-anchor="middle" fill="#9A3412" font-family="monospace" font-size="13" font-weight="700">保存上下文</text>

    <rect x="-10" y="268" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <text x="50" y="296" text-anchor="middle" fill="#9A3412" font-family="monospace" font-size="13" font-weight="700">等待 resume</text>

    <path d="M 50 322 L 50 360" stroke="#22C55E" stroke-width="3"/>
    <polygon points="42,360 58,360 50,378" fill="#22C55E"/>

    <rect x="-10" y="388" width="120" height="44" rx="22" fill="#22C55E"/>
    <text x="50" y="416" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">resume</text>
  </g>

  <g transform="translate(900,220)">
