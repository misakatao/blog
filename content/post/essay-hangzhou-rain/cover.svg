<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EAF6"/>
      <stop offset="0.5" stop-color="#C5CAE9"/>
      <stop offset="1" stop-color="#9FA8DA"/>
    </linearGradient>
    <radialGradient id="pond" cx="800" cy="750" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7986CB" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C5CAE9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Lotus pond area -->
  <ellipse cx="800" cy="780" rx="500" ry="100" fill="url(#pond)"/>

  <!-- Ripples on water -->
  <ellipse cx="600" cy="750" rx="60" ry="8" stroke="#7986CB" stroke-width="1.2" fill="none" opacity="0.4"/>
  <ellipse cx="600" cy="750" rx="100" ry="13" stroke="#7986CB" stroke-width="0.8" fill="none" opacity="0.25"/>
  <ellipse cx="1000" cy="770" rx="50" ry="7" stroke="#7986CB" stroke-width="1" fill="none" opacity="0.35"/>
  <ellipse cx="1000" cy="770" rx="90" ry="12" stroke="#7986CB" stroke-width="0.7" fill="none" opacity="0.2"/>
  <ellipse cx="800" cy="800" rx="70" ry="9" stroke="#7986CB" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Lotus leaves -->
  <ellipse cx="500" cy="720" rx="55" ry="20" fill="#66BB6A" opacity="0.35"/>
  <ellipse cx="1100" cy="740" rx="50" ry="18" fill="#66BB6A" opacity="0.3"/>
  <ellipse cx="750" cy="760" rx="45" ry="16" fill="#81C784" opacity="0.3"/>

  <!-- Rain drops falling -->
  <circle cx="400" cy="200" r="3" fill="#7986CB" opacity="0.5"/>
  <circle cx="400" cy="230" r="2" fill="#7986CB" opacity="0.35"/>
  <circle cx="700" cy="150" r="3.5" fill="#7986CB" opacity="0.45"/>
  <circle cx="1000" cy="180" r="3" fill="#7986CB" opacity="0.5"/>
  <circle cx="1300" cy="220" r="2.5" fill="#7986CB" opacity="0.4"/>
  <circle cx="250" cy="350" r="2.5" fill="#9FA8DA" opacity="0.4"/>
  <circle cx="1400" cy="380" r="3" fill="#9FA8DA" opacity="0.35"/>

  <!-- Decorative bokeh circles -->
  <circle cx="200" cy="150" r="50" fill="#7986CB" opacity="0.1"/>
  <circle cx="1400" cy="120" r="65" fill="#9FA8DA" opacity="0.12"/>
  <circle cx="100" cy="600" r="40" fill="#C5CAE9" opacity="0.2"/>
  <circle cx="1500" cy="500" r="55" fill="#7986CB" opacity="0.1"/>
  <circle cx="800" cy="100" r="45" fill="#E8EAF6" opacity="0.3"/>

  <!-- Soft clouds -->
  <ellipse cx="300" cy="120" rx="120" ry="40" fill="#FFFFFF" opacity="0.25" filter="url(#soft)"/>
  <ellipse cx="1200" cy="100" rx="150" ry="45" fill="#FFFFFF" opacity="0.2" filter="url(#soft)"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#283593" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">杭州的雨</text>
  <text x="800" y="500" text-anchor="middle" fill="#3949AB" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">雨下得正好，不早不晚</text>
</svg>
