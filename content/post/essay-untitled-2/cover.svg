  <path d="M1200 0C1190 200 1195 400 1185 600C1180 750 1182 900 1182 900" stroke="#F57F17" stroke-width="2" opacity="0.15" fill="none"/>
  <path d="M1250 0C1242 180 1248 380 1240 580C1236 740 1238 900 1238 900" stroke="#F57F17" stroke-width="1.5" opacity="0.12" fill="none"/>
  <path d="M1300 0C1294 200 1298 400 1292 600C1288 750 1290 900 1290 900" stroke="#F57F17" stroke-width="1" opacity="0.1" fill="none"/>
  <!-- Sofa corner -->
  <path d="M100 600C100 570 130 550 180 550L700 550C740 550 760 570 760 600L760 750L100 750Z" fill="#F57F17" opacity="0.12"/>
  <path d="M100 550C100 510 130 490 180 490L700 490C740 490 760 510 760 550" fill="#F57F17" opacity="0.08"/>
  <!-- Golden dust motes -->
  <circle cx="900" cy="200" r="3" fill="#F57F17" opacity="0.3"/>
