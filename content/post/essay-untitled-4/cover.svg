<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F7FA"/>
      <stop offset="0.5" stop-color="#B2EBF2"/>
      <stop offset="1" stop-color="#80DEEA"/>
    </linearGradient>
    <radialGradient id="steamGlow4" cx="800" cy="400" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#80DEEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft4"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="steamF"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>
  <!-- Central steam glow -->
  <ellipse cx="800" cy="400" rx="400" ry="300" fill="url(#steamGlow4)"/>
  <!-- Steam wisps -->
  <g opacity="0.2" filter="url(#steamF)">
    <path d="M500 750C510 680 495 620 505 560C515 500 530 450 520 400" stroke="white" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M750 770C762 700 748 640 758 580C768 520 782 470 776 410" stroke="white" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M1050 760C1058 690 1045 630 1055 570C1065 510 1078 460 1072 400" stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Water droplets -->
  <circle cx="350" cy="250" r="5" fill="#006064" opacity="0.15"/>
  <circle cx="500" cy="300" r="4" fill="#006064" opacity="0.12"/>
  <circle cx="700" cy="220" r="4.5" fill="#006064" opacity="0.14"/>
  <circle cx="1000" cy="280" r="5" fill="#006064" opacity="0.12"/>
  <circle cx="1200" cy="230" r="4" fill="#006064" opacity="0.1"/>
  <circle cx="1350" cy="310" r="3.5" fill="#006064" opacity="0.13"/>
  <circle cx="450" cy="600" r="4" fill="#006064" opacity="0.1"/>
  <circle cx="1100" cy="620" r="3.5" fill="#006064" opacity="0.08"/>
  <!-- Decorative bokeh -->
  <circle cx="200" cy="180" r="90" fill="#80DEEA" opacity="0.2" filter="url(#soft4)"/>
  <circle cx="1400" cy="200" r="110" fill="#E0F7FA" opacity="0.35" filter="url(#soft4)"/>
  <circle cx="300" cy="700" r="70" fill="#006064" opacity="0.06" filter="url(#soft4)"/>
  <circle cx="1300" cy="680" r="80" fill="#80DEEA" opacity="0.15" filter="url(#soft4)"/>
  <circle cx="800" cy="150" r="60" fill="#B2EBF2" opacity="0.3"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#006064" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">无题（四）</text>
  <text x="800" y="500" text-anchor="middle" fill="#006064" fill-opacity="0.6" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">那一刻，我觉得毛巾比我幸福</text>
</svg>
