<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F7FA"/>
      <stop offset="0.6" stop-color="#B2DFDB"/>
      <stop offset="1" stop-color="#80CBC4"/>
    </linearGradient>
    <radialGradient id="mist" cx="800" cy="450" r="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#E0F7FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="500" rx="500" ry="300" fill="url(#mist)"/>

  <!-- Cave arch shape -->
  <path d="M0 0L0 900L400 900C380 650 420 400 550 300C680 200 750 180 800 170C850 180 920 200 1050 300C1180 400 1220 650 1200 900L1600 900L1600 0Z" fill="#004D40" opacity="0.15"/>
  <path d="M0 0L0 900L300 900C290 700 350 450 500 330C650 210 750 190 800 180C850 190 950 210 1100 330C1250 450 1310 700 1300 900L1600 900L1600 0Z" fill="#004D40" opacity="0.08"/>

  <!-- Green moss patches -->
  <ellipse cx="350" cy="650" rx="60" ry="20" fill="#4DB6AC" opacity="0.4"/>
  <ellipse cx="1250" cy="680" rx="50" ry="15" fill="#4DB6AC" opacity="0.35"/>
  <ellipse cx="450" cy="750" rx="40" ry="12" fill="#26A69A" opacity="0.3"/>
  <ellipse cx="1150" cy="770" rx="45" ry="14" fill="#26A69A" opacity="0.3"/>

  <!-- Water droplets -->
  <circle cx="600" cy="300" r="4" fill="#80CBC4" opacity="0.7"/>
  <circle cx="600" cy="330" r="3" fill="#80CBC4" opacity="0.5"/>
  <circle cx="750" cy="280" r="3.5" fill="#80CBC4" opacity="0.6"/>
  <circle cx="900" cy="310" r="4" fill="#80CBC4" opacity="0.65"/>
  <circle cx="1000" cy="340" r="3" fill="#80CBC4" opacity="0.5"/>
  <circle cx="700" cy="360" r="2.5" fill="#B2DFDB" opacity="0.6"/>
  <circle cx="850" cy="380" r="3" fill="#B2DFDB" opacity="0.5"/>

  <!-- Decorative bokeh circles -->
  <circle cx="200" cy="200" r="45" fill="#80CBC4" opacity="0.15"/>
  <circle cx="1400" cy="180" r="60" fill="#4DB6AC" opacity="0.12"/>
  <circle cx="300" cy="500" r="35" fill="#B2DFDB" opacity="0.2"/>
  <circle cx="1350" cy="550" r="50" fill="#80CBC4" opacity="0.1"/>
  <circle cx="150" cy="750" r="30" fill="#4DB6AC" opacity="0.15"/>

  <!-- Mist wisps -->
  <ellipse cx="800" cy="600" rx="300" ry="40" fill="#FFFFFF" opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="600" cy="700" rx="200" ry="25" fill="#FFFFFF" opacity="0.15" filter="url(#soft)"/>
  <ellipse cx="1000" cy="650" rx="180" ry="30" fill="#FFFFFF" opacity="0.15" filter="url(#soft)"/>

  <!-- Water pool at bottom -->
  <ellipse cx="800" cy="820" rx="250" ry="30" fill="#80CBC4" opacity="0.25"/>
  <ellipse cx="800" cy="820" rx="120" ry="12" fill="#4DB6AC" opacity="0.15"/>

  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#004D40" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">游风水洞有感</text>
  <text x="800" y="500" text-anchor="middle" fill="#00695C" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">鞋子是干的，裤子是湿的</text>
</svg>
