<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3E0"/>
      <stop offset="0.5" stop-color="#FFE0B2"/>
      <stop offset="1" stop-color="#FFCC80"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="700" cy="400" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFCC80" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <!-- Warm light center -->
  <ellipse cx="700" cy="420" rx="400" ry="280" fill="url(#warmLight)"/>
  <!-- Silky fabric drape lines -->
  <path d="M200 300C450 280 700 310 950 290C1150 275 1350 295 1500 285" stroke="#E65100" stroke-width="1.5" opacity="0.12" fill="none"/>
  <path d="M150 380C400 365 650 390 900 375C1100 362 1300 380 1500 370" stroke="#E65100" stroke-width="1.2" opacity="0.1" fill="none"/>
  <path d="M250 460C500 448 750 470 1000 455C1200 443 1400 460 1550 452" stroke="#FFCC80" stroke-width="2" opacity="0.2" fill="none"/>
  <path d="M100 540C350 528 600 550 850 535C1050 523 1300 540 1500 532" stroke="#E65100" stroke-width="1" opacity="0.08" fill="none"/>
  <path d="M200 620C450 610 700 628 950 615C1150 605 1350 620 1550 612" stroke="#FFCC80" stroke-width="1.5" opacity="0.15" fill="none"/>
  <!-- Decorative circles -->
  <circle cx="300" cy="200" r="100" fill="#FFCC80" opacity="0.2" filter="url(#soft3)"/>
  <circle cx="1300" cy="250" r="120" fill="#FFF3E0" opacity="0.35" filter="url(#soft3)"/>
  <circle cx="150" cy="650" r="80" fill="#E65100" opacity="0.06" filter="url(#soft3)"/>
  <circle cx="1400" cy="700" r="90" fill="#FFCC80" opacity="0.15" filter="url(#soft3)"/>
  <circle cx="800" cy="750" r="70" fill="#FFE0B2" opacity="0.3"/>
  <!-- Floating particles -->
  <circle cx="500" cy="250" r="4" fill="#E65100" opacity="0.15"/>
  <circle cx="1000" cy="300" r="3" fill="#E65100" opacity="0.12"/>
  <circle cx="350" cy="500" r="3.5" fill="#FFCC80" opacity="0.25"/>
  <circle cx="1150" cy="550" r="3" fill="#E65100" opacity="0.1"/>
  <!-- Title -->
  <text x="800" y="450" text-anchor="middle" fill="#E65100" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="72" font-weight="700">无题（三）</text>
  <text x="800" y="500" text-anchor="middle" fill="#E65100" fill-opacity="0.6" font-family="'PingFang SC', 'Noto Serif SC', sans-serif" font-size="28">隔着一层丝袜</text>
</svg>
