<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1440" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF5FF"/>
      <stop offset="0.5" stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FAF5FF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="boxA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="boxB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="boxC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#581C87" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1340" cy="100" r="90" fill="#C084FC" fill-opacity="0.25"/>
  <circle cx="140" cy="160" r="70" fill="#D8B4FE" fill-opacity="0.3"/>
  <circle cx="1400" cy="780" r="100" fill="#A855F7" fill-opacity="0.2"/>

  <g filter="url(#soft)">
    <rect x="110" y="120" width="1380" height="660" rx="36" fill="url(#panel)"/>
  </g>

  <g transform="translate(220,380)">
    <rect x="0" y="-80" width="160" height="160" rx="20" fill="url(#boxA)" opacity="0.3"/>
    <rect x="40" y="-40" width="160" height="160" rx="20" fill="url(#boxA)" opacity="0.5"/>
    <rect x="80" y="0" width="160" height="160" rx="20" fill="url(#boxA)" opacity="0.75"/>
    <rect x="120" y="40" width="160" height="160" rx="20" fill="url(#boxA)"/>
    <text x="200" y="130" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="18" font-weight="700">位移</text>
    <text x="200" y="155" text-anchor="middle" fill="#F3E8FF" font-family="monospace" font-size="11">translate</text>
  </g>

  <g transform="translate(540,400)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="url(#boxB)" opacity="0.4"/>
    <g transform="translate(80,80) rotate(30) translate(-80,-80)">
      <rect x="0" y="0" width="160" height="160" rx="20" fill="url(#boxB)" opacity="0.7"/>
    </g>
    <g transform="translate(80,80) rotate(60) translate(-80,-80)">
      <rect x="0" y="0" width="160" height="160" rx="20" fill="url(#boxB)"/>
    </g>
    <text x="80" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="18" font-weight="700">旋转</text>
    <text x="80" y="110" text-anchor="middle" fill="#FDF4FF" font-family="monospace" font-size="11">rotate</text>
  </g>

  <g transform="translate(860,360)">
    <rect x="70" y="130" width="60" height="60" rx="10" fill="url(#boxC)" opacity="0.35"/>
    <rect x="50" y="100" width="100" height="100" rx="14" fill="url(#boxC)" opacity="0.6"/>
    <rect x="20" y="60" width="160" height="160" rx="20" fill="url(#boxC)"/>
    <text x="100" y="146" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="18" font-weight="700">缩放</text>
    <text x="100" y="170" text-anchor="middle" fill="#FFF7ED" font-family="monospace" font-size="11">scale</text>
  </g>

  <g transform="translate(1120,400)">
    <circle cx="80" cy="80" r="60" fill="#60A5FA" opacity="0.2"/>
    <circle cx="80" cy="80" r="60" fill="#60A5FA" opacity="0.4"/>
    <circle cx="80" cy="80" r="60" fill="#60A5FA" opacity="0.7"/>
    <circle cx="80" cy="80" r="60" fill="#2563EB"/>
    <text x="80" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC', sans-serif" font-size="18" font-weight="700">透明度</text>
  </g>

  <g transform="translate(220,220)">
    <rect x="0" y="0" width="1160" height="100" rx="16" fill="#0F172A"/>
    <text x="40" y="38" fill="#F0ABFC" font-family="monospace" font-size="15" font-weight="700">[UIView animateWithDuration:0.3 animations:^{</text>
    <text x="80" y="68" fill="#E2E8F0" font-family="monospace" font-size="15">view.transform = CGAffineTransformMakeScale(1.2, 1.2);</text>
    <text x="80" y="88" fill="#E2E8F0" font-family="monospace" font-size="15">view.alpha = 0.5;</text>
    <text x="40" y="88" fill="#F0ABFC" font-family="monospace" font-size="15" font-weight="700">}];</text>
  </g>

  <g transform="translate(220,620)">
    <line x1="0" y1="20" x2="1160" y2="20" stroke="#A855F7" stroke-width="2" opacity="0.3"/>
    <circle cx="100" cy="20" r="10" fill="#A855F7"/>
    <circle cx="400" cy="20" r="10" fill="#D946EF"/>
    <circle cx="700" cy="20" r="10" fill="#F97316"/>
    <circle cx="1000" cy="20" r="10" fill="#2563EB"/>
    <text x="100" y="56" text-anchor="middle" fill="#581C87" font-family="monospace" font-size="12">0.0s</text>
    <text x="400" y="56" text-anchor="middle" fill="#581C87" font-family="monospace" font-size="12">0.1s</text>
    <text x="700" y="56" text-anchor="middle" fill="#581C87" font-family="monospace" font-size="12">0.2s</text>
    <text x="1000" y="56" text-anchor="middle" fill="#581C87" font-family="monospace" font-size="12">0.3s</text>
  </g>

  <text x="800" y="760" text-anchor="middle" fill="#581C87" font-family="'PingFang SC', sans-serif" font-size="28" font-weight="700">UIView 动画事务 · 位移 · 旋转 · 缩放 · 透明</text>
</svg>
