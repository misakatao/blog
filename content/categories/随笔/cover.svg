  <g transform="translate(60,30) rotate(-5)">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#FFFFFF" stroke="#F48FB1" stroke-width="1.5"/>
    <rect x="6" y="12" width="30" height="3" rx="1.5" fill="#F48FB1" opacity="0.4"/>
    <rect x="6" y="20" width="50" height="3" rx="1.5" fill="#F48FB1" opacity="0.3"/>
    <rect x="6" y="28" width="40" height="3" rx="1.5" fill="#F48FB1" opacity="0.3"/>
    <rect x="6" y="36" width="55" height="3" rx="1.5" fill="#F48FB1" opacity="0.25"/>
