<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightBg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.45" stop-color="#1B4F72"/>
      <stop offset="0.8" stop-color="#5B8DB8"/>
      <stop offset="1" stop-color="#3A6A8A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="1300" cy="140" r="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#nightBg)"/>
  <circle cx="1300" cy="140" r="220" fill="url(#moonGlow)"/>
  <!-- Moon -->
  <circle cx="1300" cy="140" r="48" fill="#EEF4FF" opacity="0.85"/>
  <circle cx="1320" cy="130" r="48" fill="#0D1B2A" opacity="0.8"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="2" fill="white" opacity="0.6"/>
  <circle cx="320" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="560" cy="55" r="2" fill="white" opacity="0.55"/>
  <circle cx="780" cy="35" r="1.5" fill="white" opacity="0.48"/>
  <circle cx="1000" cy="65" r="2" fill="white" opacity="0.52"/>
  <circle cx="1480" cy="50" r="1.5" fill="white" opacity="0.55"/>
  <!-- Moonlight beam through curtain -->
  <path d="M1200 0L1400 0L1050 900L850 900Z" fill="white" opacity="0.02"/>
  <!-- Curtain silhouette -->
  <path d="M1150 0C1140 200 1160 400 1130 600C1110 750 1120 900 1120 900L1600 900L1600 0Z" fill="#0A1520" opacity="0.5"/>
  <path d="M1150 0C1155 150 1145 300 1155 450" stroke="#5B8DB8" stroke-width="1" opacity="0.2"/>
  <!-- Floor -->
  <path d="M0 750C400 730 900 738 1600 750V900H0Z" fill="#081420" opacity="0.9"/>
  <!-- Bed surface -->
  <rect x="100" y="520" width="900" height="30" rx="6" fill="#142840" opacity="0.8"/>
  <!-- Single pillow (untouched side empty) -->
  <ellipse cx="280" cy="508" rx="130" ry="32" fill="#1E3A5C" opacity="0.75"/>
  <!-- Blanket rumpled on one side -->
  <path d="M120 518C200 500 400 494 600 508C700 514 750 520 120 540Z" fill="#1A3050" opacity="0.8"/>
  <!-- Empty side of bed - flat, cold -->
  <path d="M600 508C780 502 920 506 980 512L980 530L600 524Z" fill="#122840" opacity="0.6"/>
  <!-- Moonlight patch on empty bed -->
  <ellipse cx="780" cy="510" rx="120" ry="40" fill="#5B8DB8" opacity="0.06" filter="url(#blur)"/>
  <!-- Bokeh -->
  <circle cx="200" cy="350" r="50" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1400" cy="380" r="60" fill="#4A6FA5" opacity="0.08" filter="url(#blur)"/>
  <!-- Atmospheric particles -->
  <circle cx="400" cy="300" r="1.5" fill="#A8D8EA" opacity="0.3"/>
  <circle cx="700" cy="250" r="1" fill="#A8D8EA" opacity="0.25"/>
  <circle cx="900" cy="350" r="1.5" fill="#A8D8EA" opacity="0.28"/>
  <circle cx="1100" cy="280" r="1" fill="#A8D8EA" opacity="0.22"/>
  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="80" font-weight="700">睡（一）</text>
  <text x="118" y="192" fill="#C8D8F0" fill-opacity="0.80" font-family="'Noto Serif SC','Source Han Serif',Georgia,serif" font-size="28">半夜伸手，摸到的是空的被窝</text>
</svg>
