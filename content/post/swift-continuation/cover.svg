<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1440" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.5" stop-color="#FFEDD5"/>
      <stop offset="1" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF7ED" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="swiftBird" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="suspend" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#9A3412" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1340" cy="100" r="90" fill="#FB923C" fill-opacity="0.25"/>
  <circle cx="140" cy="160" r="70" fill="#FDBA74" fill-opacity="0.3"/>
  <circle cx="1400" cy="780" r="100" fill="#F97316" fill-opacity="0.2"/>

  <g filter="url(#soft)">
    <rect x="110" y="120" width="1380" height="660" rx="36" fill="url(#panel)"/>
  </g>

  <g transform="translate(180,200)">
    <rect x="0" y="0" width="520" height="500" rx="24" fill="#0F172A"/>
    <rect x="0" y="0" width="520" height="44" rx="24" fill="#1E293B"/>
    <rect x="0" y="20" width="520" height="24" fill="#1E293B"/>
    <circle cx="24" cy="22" r="7" fill="#EF4444"/>
    <circle cx="50" cy="22" r="7" fill="#F59E0B"/>
    <circle cx="76" cy="22" r="7" fill="#22C55E"/>
    <text x="260" y="28" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">Continuation.swift</text>

    <text x="30" y="88" fill="#F472B6" font-family="monospace" font-size="15">func</text>
    <text x="80" y="88" fill="#60A5FA" font-family="monospace" font-size="15">fetch</text>
    <text x="130" y="88" fill="#E2E8F0" font-family="monospace" font-size="15">() </text>
    <text x="162" y="88" fill="#F472B6" font-family="monospace" font-size="15">async throws</text>
    <text x="290" y="88" fill="#E2E8F0" font-family="monospace" font-size="15"> -&gt; String {</text>

    <text x="60" y="120" fill="#F472B6" font-family="monospace" font-size="15">try await</text>
    <text x="160" y="120" fill="#FDE68A" font-family="monospace" font-size="15">withCheckedThrowingContinuation</text>

    <text x="80" y="152" fill="#E2E8F0" font-family="monospace" font-size="15">{ continuation </text>
    <text x="230" y="152" fill="#F472B6" font-family="monospace" font-size="15">in</text>

    <text x="100" y="196" fill="#94A3B8" font-family="monospace" font-size="14">// callback world</text>
    <text x="100" y="220" fill="#E2E8F0" font-family="monospace" font-size="15">someAPI { result </text>
    <text x="248" y="220" fill="#F472B6" font-family="monospace" font-size="15">in</text>

    <text x="120" y="256" fill="#F472B6" font-family="monospace" font-size="15">if let</text>
    <text x="180" y="256" fill="#E2E8F0" font-family="monospace" font-size="15"> value = result {</text>

    <text x="140" y="288" fill="#60A5FA" font-family="monospace" font-size="15">continuation</text>
    <text x="262" y="288" fill="#E2E8F0" font-family="monospace" font-size="15">.</text>
    <text x="270" y="288" fill="#6EE7B7" font-family="monospace" font-size="15">resume</text>
    <text x="334" y="288" fill="#E2E8F0" font-family="monospace" font-size="15">(returning: value)</text>

    <text x="120" y="320" fill="#F472B6" font-family="monospace" font-size="15">} else {</text>

    <text x="140" y="352" fill="#60A5FA" font-family="monospace" font-size="15">continuation</text>
    <text x="262" y="352" fill="#E2E8F0" font-family="monospace" font-size="15">.</text>
    <text x="270" y="352" fill="#FCA5A5" font-family="monospace" font-size="15">resume</text>
    <text x="334" y="352" fill="#E2E8F0" font-family="monospace" font-size="15">(throwing: error)</text>

    <text x="120" y="384" fill="#E2E8F0" font-family="monospace" font-size="15">}</text>
    <text x="100" y="416" fill="#E2E8F0" font-family="monospace" font-size="15">}</text>
    <text x="80" y="448" fill="#E2E8F0" font-family="monospace" font-size="15">}</text>
    <text x="30" y="472" fill="#E2E8F0" font-family="monospace" font-size="15">}</text>
  </g>

  <g transform="translate(740,300)">
