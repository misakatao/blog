    <text x="230" y="44" text-anchor="middle" fill="#9A3412" font-family="'PingFang SC', sans-serif" font-size="20" font-weight="700">四种 Continuation</text>
    <line x1="30" y1="60" x2="430" y2="60" stroke="#FED7AA" stroke-width="1"/>

    <g transform="translate(30,80)">
      <rect x="0" y="0" width="400" height="88" rx="12" fill="#FEF3C7"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#D97706"/>
      <text x="20" y="30" fill="#78350F" font-family="monospace" font-size="14" font-weight="700">withUnsafeContinuation</text>
      <text x="20" y="52" fill="#92400E" font-family="monospace" font-size="11">Throw: ❌   Checked: ❌</text>
      <text x="20" y="72" fill="#92400E" font-family="monospace" font-size="11">性能最高 · 风险最大</text>
      <text x="370" y="52" text-anchor="middle" fill="#D97706" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="700">⭐</text>
    </g>

    <g transform="translate(30,180)">
      <rect x="0" y="0" width="400" height="88" rx="12" fill="#FED7AA"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#EA580C"/>
      <text x="20" y="30" fill="#7C2D12" font-family="monospace" font-size="13" font-weight="700">withUnsafeThrowingContinuation</text>
      <text x="20" y="52" fill="#9A3412" font-family="monospace" font-size="11">Throw: ✅   Checked: ❌</text>
      <text x="20" y="72" fill="#9A3412" font-family="monospace" font-size="11">支持错误 · 无检查</text>
      <text x="370" y="52" text-anchor="middle" fill="#EA580C" font-family="'PingFang SC', sans-serif" font-size="16" font-weight="700">⭐</text>
    </g>

    <g transform="translate(30,280)">
      <rect x="0" y="0" width="400" height="88" rx="12" fill="#DCFCE7"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#16A34A"/>
      <text x="20" y="30" fill="#14532D" font-family="monospace" font-size="14" font-weight="700">withCheckedContinuation</text>
      <text x="20" y="52" fill="#166534" font-family="monospace" font-size="11">Throw: ❌   Checked: ✅</text>
      <text x="20" y="72" fill="#166534" font-family="monospace" font-size="11">运行时安全检查</text>
      <text x="370" y="52" text-anchor="middle" fill="#16A34A" font-family="'PingFang SC', sans-serif" font-size="14" font-weight="700">⭐⭐⭐⭐</text>
    </g>

    <g transform="translate(30,380)">
      <rect x="0" y="0" width="400" height="88" rx="12" fill="#DBEAFE"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#2563EB"/>
      <text x="20" y="30" fill="#1E3A8A" font-family="monospace" font-size="13" font-weight="700">withCheckedThrowingContinuation</text>
      <text x="20" y="52" fill="#1E40AF" font-family="monospace" font-size="11">Throw: ✅   Checked: ✅</text>
      <text x="20" y="72" fill="#1E40AF" font-family="monospace" font-size="11">生产环境首选</text>
      <text x="370" y="52" text-anchor="middle" fill="#2563EB" font-family="'PingFang SC', sans-serif" font-size="12" font-weight="700">⭐⭐⭐⭐⭐</text>
    </g>
  </g>

  <g transform="translate(120,740)">
    <rect x="0" y="0" width="1360" height="24" rx="12" fill="#0F172A" fill-opacity="0.6"/>
    <text x="680" y="17" text-anchor="middle" fill="#FDBA74" font-family="monospace" font-size="13">callback  →  Continuation  →  async / await</text>
  </g>

  <text x="800" y="185" text-anchor="middle" fill="#9A3412" font-family="'PingFang SC', sans-serif" font-size="32" font-weight="800">Swift Continuation</text>
</svg>
