<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1B2A"/>
      <stop offset="0.5" stop-color="#1B4F72"/>
      <stop offset="1" stop-color="#5B8DB8"/>
    </linearGradient>
    <radialGradient id="warmth" cx="800" cy="500" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A0B8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="500" r="300" fill="url(#warmth)"/>

  <!-- Rain streaks -->
  <g stroke="#7FBCD2" stroke-width="0.7" opacity="0.15">
    <line x1="100" y1="0" x2="90" y2="900"/>
    <line x1="250" y1="0" x2="240" y2="900"/>
    <line x1="380" y1="0" x2="370" y2="900"/>
    <line x1="520" y1="0" x2="510" y2="900"/>
    <line x1="680" y1="0" x2="670" y2="900"/>
    <line x1="820" y1="0" x2="810" y2="900"/>
    <line x1="960" y1="0" x2="950" y2="900"/>
    <line x1="1120" y1="0" x2="1110" y2="900"/>
    <line x1="1280" y1="0" x2="1270" y2="900"/>
    <line x1="1440" y1="0" x2="1430" y2="900"/>
  </g>

  <!-- Umbrella edge silhouette -->
  <path d="M600 320C650 280 750 260 850 260C950 260 1050 280 1100 320C1100 325 1050 330 850 330C650 330 600 325 600 320Z" fill="#0A1220" opacity="0.6"/>
  <line x1="850" y1="330" x2="850" y2="650" stroke="#0A1220" stroke-width="3" opacity="0.5"/>

  <!-- Rain drops on umbrella edge -->
  <circle cx="620" cy="322" r="2" fill="#7FBCD2" opacity="0.5"/>
  <circle cx="620" cy="340" r="1.5" fill="#7FBCD2" opacity="0.35"/>
  <circle cx="1080" cy="322" r="2" fill="#7FBCD2" opacity="0.5"/>
  <circle cx="1080" cy="338" r="1.5" fill="#7FBCD2" opacity="0.3"/>
  <circle cx="750" cy="325" r="1.5" fill="#7FBCD2" opacity="0.4"/>
  <circle cx="950" cy="326" r="1.5" fill="#7FBCD2" opacity="0.4"/>

  <!-- Two faces close together (silhouette) -->
  <g opacity="0.55">
    <ellipse cx="820" cy="450" rx="35" ry="40" fill="#0A1220"/>
    <ellipse cx="880" cy="450" rx="35" ry="40" fill="#0A1220"/>
    <path d="M820 480C830 490 840 495 850 495C860 495 870 490 880 480" stroke="#0A1220" stroke-width="3" fill="none"/>
  </g>

  <!-- Subtle lip highlight -->
  <path d="M840 470C845 473 855 473 860 470" stroke="#E8A0B8" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- Rain splashes on ground -->
  <g fill="none" stroke="#5B8DB8" stroke-width="0.5" opacity="0.2">
    <ellipse cx="300" cy="800" rx="20" ry="3"/>
    <ellipse cx="600" cy="820" rx="25" ry="3"/>
    <ellipse cx="1100" cy="810" rx="22" ry="3"/>
    <ellipse cx="1400" cy="830" rx="18" ry="3"/>
  </g>

  <!-- Ground -->
  <path d="M0 820C400 810 800 815 1600 820V900H0Z" fill="#081018" opacity="0.75"/>

  <!-- Atmospheric particles -->
  <g fill="#7FBCD2" opacity="0.2" filter="url(#glow)">
    <circle cx="400" cy="400" r="2"/>
    <circle cx="1200" cy="350" r="2.5"/>
    <circle cx="300" cy="600" r="2"/>
    <circle cx="1300" cy="550" r="2"/>
  </g>

  <!-- Title -->
  <text x="112" y="126" fill="#FFFFFF" fill-opacity="0.95" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="80" font-weight="700">亲嘴</text>
  <text x="118" y="172" fill="#FFFFFF" fill-opacity="0.78" font-family="'Noto Serif SC', 'Source Han Serif', Georgia, serif" font-size="28">她跟我亲嘴，多亲一会就湿了</text>
</svg>
